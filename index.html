 "Battelle Darby Creek Metro Park": "El parque de los bisontes — una manada de verdad pastando en pradera restaurada al oeste de Columbus, más senderos del Big Darby Creek y un gran centro de naturaleza. A unos 40 minutos de Worthington.",
 "Hollywood Casino Columbus": "El casino del lado oeste — máquinas, mesas, sala de póker y restaurantes bajo un mismo techo. La opción nocturna para mayores de 21.",
 "Walnut Woods Metro Park": "Un bosque de pinos blancos de 100 pies plantados entre los años 30 y 70 en el sureste — senderos tranquilos por una catedral verde.",
 "Dawes Arboretum": "1,900 acres de jardines, un jardín japonés y un seto que deletrea 'Dawes Arboretum' legible desde el aire. A unos 45 minutos de Worthington.",
 "Newark Earthworks": "Los movimientos de tierra antiguos más grandes del mundo — geometría Hopewell de 2,000 años: un círculo y un octágono perfectos alineados con la luna. Historia nivel UNESCO, a unos 45 minutos.",
 "Buckeye Lake State Park": "El parque estatal más antiguo de Ohio, en el gran lago recreativo al este — playa para nadar, botes y bares a la orilla. Modo escapada de verano, a unos 40 minutos.",
 "Old Man's Cave": "El mayor éxito de Hocking Hills — una cueva enorme en un cañón de cicuta con cascadas y puentes de piedra. A una hora de Worthington, más o menos, y vale cada minuto; los fines de semana se llena.",
 "Ash Cave": "Una cueva en forma de herradura de 700 pies de ancho con una cascada cayendo desde el borde — la cueva empotrada más grande de Ohio, por un sendero pavimentado fácil en Hocking Hills.",
 "Cedar Falls": "La cascada con más volumen de agua de Hocking Hills — caída con sombra de cicutas entre Old Man's Cave y Ash Cave. En realidad no hay cedros; los primeros colonos confundieron las cicutas.",
 "Delaware State Park": "El parque estatal del lago Delaware, justo al norte del pueblo — una playa grande para nadar, marina y pesca en el embalse.",

 "Gallant Woods Park": "La reserva de bosque antiguo de Preservation Parks — árboles grandes, un centro de naturaleza y senderos tranquilos al oeste de Delaware.",
 "Shale Hollow Park": "Una joya en forma de cañoncito — un arroyo cortando acantilados de esquisto con piedras de concreción, más un área de juego natural. El parque pequeño más bonito de Preservation Parks.",
 "Highlands Park Aquatic Center": "El parque acuático al aire libre de Westerville — toboganes, río lento y una alberca grande de recreo. Solo en verano.",
 "Hanby House": "La casa de la familia Hanby — parada del Ferrocarril Subterráneo y hogar del compositor de 'Up on the Housetop', escrita aquí mismo. Casa pequeña, historia profunda.",

 "Wyandot Popcorn Museum": "El único museo de palomitas del mundo — máquinas antiguas de palomitas bajo una carpa de circo dentro de Heritage Hall. Marion fue capital palomitera; esto es Ohio curioso al máximo.",
 "Ariel-Foundation Park": "Un parque de 250 acres construido alrededor de una fábrica de vidrio en ruinas — la torre de observación Rastin, lagos y ruinas industriales como arte. A unos 50 minutos al noreste y genuinamente único.",
 "Mohican State Park": "La tierra de aventura de Ohio — el cañón del Clear Fork, puente cubierto, torre de incendios y zona de renta de río. A una hora al noreste, más o menos; la otra gran escapada a la naturaleza.",

 "Mauthe Park": "El parque de Struthers del lado de Yellow Creek — juegos, canchas y la gente de los conciertos de verano.",
 "Roosevelt Park": "El parque vecinal de Campbell — canchas, juegos y sombra para picnic, justo al este de Youngstown.",
 "Avalon at Squaw Creek": "El campo de golf Avalon en Squaw Creek — un campo clásico tipo club campestre del área de Warren, con opciones de juego público.",
 "Yankee Lake": "El pueblito lacustre de Brookfield — un lago de pesca con pago y lugar de fiesta que ha sido tradición local de verano desde siempre.",
 "Howland Township Park": "El parque municipal de Howland — senderos, canchas y una concha acústica en el lado de Warren del valle.",
 "Newton Falls Covered Bridge": "El puente cubierto de 1831 sobre el río Mahoning — el segundo más antiguo de Ohio y la identidad completa del pueblo. Parada rápida y fotogénica a unos 30 minutos al oeste.",
 "Lake Milton State Park": "Un lago de 1,700 acres al oeste de Youngstown — playa para nadar, botes y pesca, a unos 25 minutos. El día de lago del valle.",
 "Berlin Lake": "Un embalse grande y tranquilo al suroeste de Youngstown — pesca, botes y camping a la orilla, a unos 35 minutos.",
 "Firestone Park": "El parque del pueblo natal de Harvey Firestone, en Columbiana — un lago, un anfiteatro y uno de los parques de pueblo más bonitos de Ohio, a unos 30 minutos al sur.",
 "West Branch State Park": "Un parque estatal grande junto al embalse Michael J. Kirwan — playa, botes y 20 millas de senderos, a unos 40 minutos al oeste.",
 "Tehachapi Loop": "La famosa espiral ferroviaria — los trenes pasan en círculo sobre sí mismos subiendo el puerto de Tehachapi. Detente en el mirador y espera un tren de carga; es teatro de ingeniería. A una hora de Bakersfield, más o menos.",
 "Tehachapi Depot Museum": "La estación ferroviaria de 1876, reconstruida, en el centro de Tehachapi — historia de trenes, un furgón de cola y asientos de primera fila para ver el tráfico del puerto.",
 "Circle Park": "El parque del pueblo de Kernville junto al río — sombra, ambiente de rodeo y el río Kern pasando justo al lado.",

 "Silver City Ghost Town": "Un pueblo fantasma rescatado junto a Lake Isabella — edificios mineros de 1870 traídos aquí y conservados como museo caminable. Tenebroso, polvoriento, genial.",
 "Greenhorn Mountain Park": "Parque del condado entre pinos sobre Lake Isabella — disc golf, áreas de picnic y aire fresco de montaña cuando el valle se está horneando.",
 "Shirley Meadow / Alta Sierra Ski Area": "La pequeña estación de esquí local de Kern sobre Lake Isabella — un par de lifts, tubing y paseos en lift en verano. Las condiciones de invierno varían; verifica antes de subir.",
 "Red Rock Canyon State Park": "Acantilados desérticos y tierras malas en todos los tonos de rojo sobre la Highway 14 — escenario de película, caminatas cortas y cielos nocturnos enormes. A 1 hora 15 de Bakersfield, más o menos.",
 "Mojave Air and Space Port": "El puerto espacial civil — historia de naves espaciales (el SpaceShipOne voló desde aquí), un cementerio de aviones visible y rarezas de pruebas de vuelo. A una hora de Bakersfield; ir a ver aviones el fin de semana es el plan.",
 "Randsburg": "Un pueblo fantasma viviente en las montañas Rand — calle principal de la fiebre del oro de 1890 con tienda general y fuente de sodas funcionando. A 1 hora 30, más o menos; combínalo con Red Rock Canyon.",
 "Twenty Mule Team Museum": "Historia del bórax en Boron — la historia de los carros de veinte mulas que sacaban bórax del Valle de la Muerte, junto al pueblo de la mina a cielo abierto.",
 "Borax Visitor Center": "El mirador sobre una de las minas de bórax más grandes del mundo — museo, película y un tajo abierto gigante con camiones que parecen de juguete pero pesan 200 toneladas.",
 "Maturango Museum": "El museo desértico de Ridgecrest — historia del territorio de petroglifos Coso, historia natural y arte del desierto. La parada de entrada si vas hacia el desierto alto.",
 "West Kern Oil Museum": "Historia petrolera en Taft — una torre de perforación de madera completa, fotos de la época del boom y la historia del Lakeview Gusher. Las raíces de oro negro de Kern.",
 "Minter Field Air Museum": "Museo de aviación de la Segunda Guerra Mundial en el viejo Minter Field de Shafter — historia de aviones de entrenamiento, hangares y días de vuelo.",
 "Fort Tejon State Historic Park": "Un fuerte del ejército de 1854 en el cañón del Grapevine — barracones restaurados, historia de dragones y encinos enormes del valle. Los días de recreación de la Guerra Civil son el gran atractivo. A unos 45 minutos al sur.",

 "Hungry Valley SVRA": "4,000 acres de rutas off-road en Gorman — trae tu vehículo todo terreno o solo mira las subidas. Otro mundo, a 45 minutos al sur.",

 "Audubon Kern River Preserve": "La reserva de bosque de álamos y sauces de Audubon en el South Fork del Kern — uno de los mejores lugares para observar aves del estado, con senderos hacia la jungla ribereña. A una hora de Bakersfield, más o menos.",
 "China Peak Mountain Resort": "La estación de esquí del lado de Fresno en Huntington Lake, a 7,000 pies de altura — el esquí de verdad más cercano al valle, a 1 hora 15 de Fresno, más o menos. Checa la nieve y los controles de cadenas en invierno.",
 "Badger Pass Ski Area": "La estación de esquí más antigua de California, dentro de Yosemite — pistas pequeñas, tranquilas y familiares en Glacier Point Road. El día de esquí con un parque nacional alrededor.",

/* ---- Filtering + plan building ---- */
const DEFAULT_FILTERS = {who:"any", vibe:"any", budget:999, time:999, setting:"any", preferIndoor:false};
function placeOK(p,f){
  if(f.who!=="any" && !p.who.includes(f.who)) return false;
  if(f.vibe!=="any" && !p.vibes.includes(f.vibe)) return false;
  if(p.cost>f.budget) return false;
  if(f.setting==="in" && p.io==="out") return false;
  if(f.setting==="out" && p.io==="in") return false;
  if(f.preferIndoor && f.setting==="any" && p.io==="out" && p.cat!=="zoo") return false;
  return true;
}
function buildPlan(places,f,lockedMain){
  f=Object.assign({},DEFAULT_FILTERS,f||{});
  const pool=places.filter(p=>placeOK(p,f));
  if(!pool.length) return null;
  let main = lockedMain && placeOK(lockedMain,f) ? lockedMain : null;
  if(!main){
    let mains=pool.filter(p=>MAIN_CATS.includes(p.cat));
    if(!mains.length) mains=pool;
    if(f.time<999){ const timed=mains.filter(p=>p.dur<=f.time); if(timed.length) mains=timed; else { const quick=pool.filter(p=>p.dur<=f.time); if(quick.length) mains=quick; } }
    if(!mains.length) return null;
    main=pick(mains);
  }
  const rest=pool.filter(p=>p!==main);
  const near=(p)=> main.lat!=null&&p.lat!=null ? haversineMi(main.lat,main.lon,p.lat,p.lon) : (p.dist||0);
  let sides=rest.filter(p=>p.cat!==main.cat && p.dur<=90 && near(p)<=6);
  if(!sides.length) sides=rest.filter(p=>p.dur<=90).sort((a,b)=>near(a)-near(b)).slice(0,3);
  const side=sides.length?pick(sides):null;
  let closers=rest.filter(p=>p!==side && CLOSER_CATS.includes(p.cat) && near(p)<=6);
  if(!closers.length) closers=rest.filter(p=>p!==side && p.dur<=45).sort((a,b)=>near(a)-near(b)).slice(0,3);
  const closer=closers.length?pick(closers):null;
  const stops=[main,side,closer].filter(Boolean);
  const totalCost=stops.reduce((s,p)=>s+p.cost,0);
  const totalTime=stops.reduce((s,p)=>s+p.dur,0);
  if(totalTime>f.time && stops.length>1){
    // time crunch: drop the closer first, then side
    let s2=[main]; let t=main.dur;
    if(side && t+side.dur<=f.time){ s2.push(side); t+=side.dur; }
    else if(closer && t+closer.dur<=f.time){ s2.push(closer); t+=closer.dur; }
    return {stops:s2, main, totalCost:s2.reduce((s,p)=>s+p.cost,0), totalTime:t};
  }
  return {stops, main, totalCost, totalTime};
}
function planText(plan,zip){
  const L=WD_LANG==="es";

  const lines=plan.stops.map((p,i)=>`${labels[i]||(L?"PARADA":"STOP")}: ${p.name} (${catLabel(p.cat)}${p.dist!=null?", "+p.dist+" mi":""}${p.cost? ", ~$"+p.cost+(L?"/persona":"/person"):(L?", Gratis":", Free")})`);
  return `What Do? \u2014 plan ${L?"para":"for"} ${zip}\n`+lines.join("\n")+`\nEst: ~$${plan.totalCost}${L?"/persona":"/person"} \u00B7 ~${Math.round(plan.totalTime/60*10)/10} hrs total`;
}

const OVERPASS_URLS=["https://overpass-api.de/api/interpreter","https://overpass.private.coffee/api/interpreter","https://overpass.kumi.systems/api/interpreter","https://overpass.nchc.org.tw/api/interpreter"];

function fetchT(url,opts,ms){
  ms=ms||10000;
  if(typeof AbortController==="undefined") return fetch(url,opts);
  const ctl=new AbortController();
  const t=setTimeout(()=>ctl.abort(),ms);
  return fetch(url,Object.assign({},opts,{signal:ctl.signal})).finally(()=>clearTimeout(t));
}
function getCache(zip){
  try{ const c=JSON.parse(localStorage.getItem(zipCacheKey)||"{}")[zip]; if(c && c.places && c.places.length && Date.now()-c.t<7*864e5) return c; }catch(e){}
  return null;
}
function setCache(zip,data){
  if(!data.places || !data.places.length) return; // never cache an empty result
  try{ const all=JSON.parse(localStorage.getItem(zipCacheKey)||"{}"); all[zip]=Object.assign({t:Date.now()},data); localStorage.setItem(zipCacheKey,JSON.stringify(all)); }catch(e){}
}
async function geocodeZip(zip){
  const r=await fetchT(`https://nominatim.openstreetmap.org/search?postalcode=${encodeURIComponent(zip)}&country=US&format=json&limit=1`,{},8000);
  const j=await r.json(); if(!j.length) throw new Error("ZIP not found");
  return {lat:parseFloat(j[0].lat), lon:parseFloat(j[0].lon), label:j[0].display_name.split(",").slice(0,2).join(",")};
}
function pickGeocodeResult(j,q){
  if(!j || !j.length) return null;
  const want=(q||"").split(",")[0].trim().toLowerCase();
  const firstSeg=(r)=>(r.display_name||"").split(",")[0].trim().toLowerCase();
  // A city that shares its name with its county (San Luis Obispo!) returns the COUNTY
  // boundary first — its centroid can be 15+ miles off. Prefer an exact name match.
  return j.find(r=>firstSeg(r)===want) || j.find(r=>!/county$/.test(firstSeg(r))) || j[0];
}
async function geocodeCity(q){
  const r=await fetchT(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&countrycodes=us&format=json&limit=5&addressdetails=1`,{},8000);
  const j=await r.json(); const hit=pickGeocodeResult(j,q); if(!hit) throw new Error("place not found");
  const a=hit.address||{};
  return {lat:parseFloat(hit.lat), lon:parseFloat(hit.lon), label:hit.display_name.split(",").slice(0,2).join(","), postcode:(a.postcode||"").slice(0,5)};
}
async function fetchPlaces(lat,lon){
  const q=`[out:json][timeout:15];(nwr["leisure"~"park|garden|miniature_golf|bowling_alley|ice_rink|sports_centre|nature_reserve|playground|beach_resort|common|dog_park"](around:10000,${lat},${lon});nwr["tourism"~"museum|gallery|zoo|aquarium|attraction|viewpoint|theme_park"](around:10000,${lat},${lon});nwr["amenity"~"cinema|theatre|arts_centre|library|marketplace|nightclub"](around:10000,${lat},${lon}););out center tags 300;`;
  const attempt=async(url)=>{
    const r=await fetchT(url,{method:"POST",body:"data="+encodeURIComponent(q),headers:{"Content-Type":"application/x-www-form-urlencoded"}},10000);
    if(!r.ok) throw new Error("overpass "+r.status);
    const j=await r.json();
    const places=placesFromElements(j.elements,lat,lon);
    if(!places.length) throw new Error("overpass empty");
    return places;
  };
  // Race all mirrors — first good answer wins; a hung mirror can't stall the roll.
  if(typeof Promise!=="undefined" && Promise.any){
    return Promise.any(OVERPASS_URLS.map(attempt));
  }
  let lastErr=null;
  for(const url of OVERPASS_URLS){ try{ return await attempt(url); }catch(e){ lastErr=e; } }
  throw lastErr||new Error("lookup failed");
}
async function fetchWeather(lat,lon){
  try{
    const r=await fetchT(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&temperature_unit=fahrenheit`,{},5000);
    const j=await r.json(); if(!j.current) return null;
    return {temp:Math.round(j.current.temperature_2m), code:j.current.weather_code};
  }catch(e){ return null; }
}

    if(f.time<999) bits.push(f.time<=70?t("time1"):f.time<=180?t("time23"):f.time<=300?t("halfDay"):t("allDay"));
    if(f.setting!=="any") bits.push(chipLabelFor("fSetting",f.setting));
    if(state.filters.preferIndoor) bits.push(t("wxIndoor"));
    $("#filterSummary").textContent=bits.length?(t("filtersWord")+bits.join(" · ")):"";
  }
  const drawer=$("#drawer"), scrim=$("#scrim");
  const openDrawer=(o)=>{ drawer.classList.toggle("open",o); scrim.classList.toggle("open",o); };
  $("#menuBtn").onclick=()=>openDrawer(true);
  scrim.onclick=()=>openDrawer(false);
  $("#drawerClose").onclick=()=>openDrawer(false);

  function fmtTime(min){ return min>=90 ? (Math.round(min/60*10)/10)+" hrs" : min+" min"; }
  function stopHTML(p,label,cls){
    const cm=CATS[p.cat];
    const maps=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name+" "+(p.addr||""))}`;
    const look=`https://www.google.com/search?q=${encodeURIComponent(p.name+" "+(p.addr||""))}`;
    const info=WD_LANG==="es" ? (p.infoEs||CAT_BLURBS_ES[p.cat]||p.info||CAT_BLURBS[p.cat]||"") : (p.info||CAT_BLURBS[p.cat]||CAT_BLURBS.generic);
    const costNote=p.cost? t("costEst")(p.cost) : t("free")+".";
    return `<div class="stop"><div class="stopLabel ${cls}">${label}</div>
      <div class="stopName">${cm.icon} ${p.name}</div>
      <div class="stopMeta">${catLabel(p.cat)}${p.dist!=null? t("distSeg")(p.dist):""} \u00B7 ~${fmtTime(p.dur)} \u00B7 ${p.cost?("~$"+p.cost+t("perPerson")):t("free")}
      ${p.addr?`<br>${p.addr}`:""}</div>
      <div class="tapHint">${t("tapInfo")}</div>
      <div class="detail"><div class="dInfo">${info}</div>
      <div class="dRow">${t("type")}: ${catLabel(p.cat)} \u00B7 ${p.io==="in"?t("indoor"):p.io==="out"?t("outdoor"):t("inOut")} \u00B7 ${t("cost")}: ${costNote}</div>
      ${p.hours?`<div class="dRow">${t("hoursFromMap")}: ${p.hours}</div>`:""}
      <div class="dLinks"><a href="${maps}" target="_blank" rel="noopener">${t("directions")}</a><a href="${look}" target="_blank" rel="noopener">${t("lookUp")}</a>${p.website?`<a href="${p.website}" target="_blank" rel="noopener">${t("website")}</a>`:""}</div></div></div>`;
  }
  function renderPlan(){
    const plan=state.plan; if(!plan) return;
    const labels=[[t("planLabels")[0],""],[t("planLabels")[1],"side"],[t("planLabels")[2],"closer"]];
    $("#planCard").innerHTML=
      `<div class="planHead"><span class="ttl">${t("yourPlan")} \u2014 ${state.label||state.zip}</span><span class="pill">${plan.stops.length} ${t("stops")}</span></div>`
      + plan.stops.map((pl,i)=>stopHTML(pl,labels[i][0],labels[i][1])).join("")
      + `<div class="totals"><div class="totalBox"><b>${plan.totalCost?("~$"+plan.totalCost):t("free")}</b><small>${t("perPersonEst")}</small></div>
         <div class="totalBox"><b>${fmtTime(plan.totalTime)}</b><small>${t("totalTime")}</small></div>
         <div class="totalBox"><b>${state.places.length}</b><small>${t("spotsNearby")}</small></div></div>`;
    $("#result").style.display="block";
    document.querySelectorAll("#planCard .stop").forEach(st=>{
      st.addEventListener("click",(e)=>{
        if(e.target.closest("a")) return;
        const d=st.querySelector(".detail"), h=st.querySelector(".tapHint");
        const open=d.classList.toggle("open");
        if(h) h.textContent=open?t("tapClose"):t("tapInfo");
      });
    });
    if($("#mapWrap").style.display==="block") drawMap();
    $("#lockBtn").textContent=state.lockedMain?t("locked"):t("lock");
    $("#lockBtn").classList.toggle("on",!!state.lockedMain);
  }

  let wdMap=null, wdLayer=null;
  function drawMap(){
    const plan=state.plan; if(!plan) return;
    if(typeof L==="undefined"){ $("#map").innerHTML="<div style=\"padding:16px\">"+t("mapFail")+"</div>"; return; }
    const stops=plan.stops.filter(x=>x.lat!=null&&x.lon!=null);
    if(!stops.length) return;
    if(!wdMap){
      wdMap=L.map("map");
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors"}).addTo(wdMap);
    }
    if(wdLayer) wdLayer.remove();
    wdLayer=L.layerGroup().addTo(wdMap);
    const labels=t("planLabels");
    const pts=[];
    stops.forEach((pl,i)=>{
      const cm=CATS[pl.cat]||{};
      const icon=L.divIcon({className:"",html:'<div class="pinNum">'+(i+1)+'</div>',iconSize:[28,28],iconAnchor:[14,14]});
      const gmaps="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(pl.name+" "+(pl.addr||""));
      L.marker([pl.lat,pl.lon],{icon:icon}).addTo(wdLayer)
        .bindPopup("<b>"+(i+1)+". "+pl.name+"</b><br>"+(labels[i]||"")+" · "+catLabel(pl.cat)+(pl.dist!=null? t("distSeg")(pl.dist):"")+'<br><a href="'+gmaps+'" target="_blank" rel="noopener">"+t("directions")+"</a>');
      pts.push([pl.lat,pl.lon]);
    });
    if(pts.length>1) L.polyline(pts,{color:"#0aa88a",weight:3,opacity:.75,dashArray:"6 6"}).addTo(wdLayer);
    if(state.center){ L.circleMarker([state.center.lat,state.center.lon],{radius:6,color:"#7c4dff",weight:2,fillColor:"#7c4dff",fillOpacity:.9}).addTo(wdLayer).bindPopup(t("searchedHere")); pts.push([state.center.lat,state.center.lon]); }
    wdMap.fitBounds(L.latLngBounds(pts).pad(0.18));
    setTimeout(()=>{ try{ wdMap.invalidateSize(); }catch(e){} },80);
  }
  $("#mapBtn").onclick=()=>{
    const wrap=$("#mapWrap"); const open=wrap.style.display==="block";
    wrap.style.display=open?"none":"block";
    $("#mapBtn").textContent=open?t("map"):t("hideMap");
    if(!open) drawMap();
  };
  function saveHistory(){
    try{
      const h=JSON.parse(localStorage.getItem("whatdo_history")||"[]");
      h.unshift({t:Date.now(), zip:state.zip, text:planText(state.plan,state.zip)});
      localStorage.setItem("whatdo_history",JSON.stringify(h.slice(0,20)));
    }catch(e){}
    renderHistory();
  }
  function renderHistory(){
    let h=[]; try{ h=JSON.parse(localStorage.getItem("whatdo_history")||"[]"); }catch(e){}
    $("#historyBox").style.display=h.length?"block":"none";
    $("#historyList").innerHTML=h.map(x=>`<div class="histItem">${x.text.replace(/\n/g,"<br>")}<br><small>${new Date(x.t).toLocaleString()}</small></div>`).join("");
  }
  $("#historyHead").onclick=()=>{ const l=$("#historyList"); const open=l.style.display!=="none"; l.style.display=open?"none":"block"; $("#histToggle").textContent=open?"[+]":"[−]"; };
  renderHistory();

  async function ensurePlaces(raw){
    const isZip=/^\d{5}$/.test(raw);
    const cacheKey=raw.toLowerCase();
    const cached=getCache(cacheKey);
    if(cached){ state.places=cached.places; state.label=cached.label; state.weather=cached.weather||null; state.center=cached.center||null; return; }
    $("#zipNote").textContent=t("finding")(raw);
    let g=null;
    const picked=(!isZip && state.picked && state.picked.key===cacheKey)?state.picked:null;
    if(picked){ g={lat:picked.lat, lon:picked.lon, label:picked.label, postcode:picked.postcode||null}; }
    else { try{ g=isZip?await geocodeZip(raw):await geocodeCity(raw); }catch(e){ g=null; } }
    let seedZip=isZip?raw:null;
    if(g && g.postcode) seedZip=g.postcode;
    if(!g){
      // Geocoder down? If this place has a starter pack, roll from the pack center instead of dying.
      const c=isZip?SEED_CENTERS[raw.slice(0,3)]:SEED_CITY_CENTERS[normCity(raw)];
      if(!c) throw new Error("geocode failed");
      g={lat:c[0], lon:c[1], label:raw};
    }
    state.label=g.label; state.center={lat:g.lat,lon:g.lon};
    let places=[];
    const wxPromise=fetchWeather(g.lat,g.lon);
    try{ places=await fetchPlaces(g.lat,g.lon); }catch(e){ places=[]; }
    // merge starters for this ZIP/city (dedupe by name), compute their distances
    for(const sp of seedForQuery(seedZip, isZip?null:raw)){
      if(!places.some(x=>x.name.toLowerCase()===sp.name.toLowerCase())){
        const c2=Object.assign({},sp);
        c2.dist=Math.round(haversineMi(g.lat,g.lon,sp.lat,sp.lon)*10)/10; places.push(c2);
      }
    }
    places.sort((a,b)=>(a.dist||99)-(b.dist||99));
    state.places=places;
    state.weather=await wxPromise;
    setCache(cacheKey,{places,label:g.label,weather:state.weather,center:state.center});
  }
  function applyWeather(){
    const w=state.weather, pill=$("#wxPill");
    state.filters.preferIndoor=false;
    if(!w){ pill.textContent=""; return; }
    const rainy=w.code>=51, hot=w.temp>=100, cold=w.temp<=38;
    let note=`${w.temp}${t("wxNow")}`;
    if(rainy||hot||cold){ state.filters.preferIndoor=true; note+=t("wxLean"); }
    pill.textContent=note; renderFilterSummary();
  }


  function applyLang(){
    document.documentElement.lang=(WD_LANG==="es"?"es":"en");
    $("#tagline").textContent=t("tagline");
    $("#zip").placeholder=t("zipPh");
    $("#locBtn").textContent=t("loc");
    if(!$("#rollBtn").disabled) $("#rollBtn").textContent=t("roll");
    $("#againBtn").textContent=t("again");
    $("#copyBtn").textContent=t("copy");
    $("#mapBtn").textContent=($("#mapWrap").style.display==="block")?t("hideMap"):t("map");
    $("#histLabel").textContent=t("history");
    $("#footNote").innerHTML=t("foot");
    $("#dFilters").textContent=t("filters");
    $("#dWho").textContent=t("fWho"); $("#dVibe").textContent=t("fVibe"); $("#dBudget").textContent=t("fBudget"); $("#dTime").textContent=t("fTime"); $("#dSetting").textContent=t("fSetting");
    $("#drawerClose").textContent=t("done");
    $("#gSmall").textContent=t("hungry"); $("#gBold").textContent=t("grub");
    $("#menuBtn").setAttribute("aria-label", t("filters"));
    document.querySelectorAll("#langToggle span[data-l]").forEach(sp=>sp.classList.toggle("on", sp.dataset.l===WD_LANG));
    buildChips(); renderFilterSummary(); applyWeather();
    if(state.plan) renderPlan();
    if($("#mapWrap").style.display==="block") drawMap();
  }
  $("#langToggle").onclick=()=>{ WD_LANG=(WD_LANG==="es"?"en":"es"); try{ localStorage.setItem("whatdo_lang",WD_LANG); }catch(e){} applyLang(); };
  applyLang();

  /* ---- search autosuggest (Photon type-ahead + starter-pack cities) ---- */
  let sugTimer=null, sugSeq=0;
  function hideSuggest(){ $("#suggest").style.display="none"; }
  function renderSuggest(items){
    const box=$("#suggest");
    if(!items.length){ hideSuggest(); return; }
    box.innerHTML="";
    items.forEach(it=>{
      const d=document.createElement("div"); d.className="sugItem";
      const a=document.createElement("div"); a.className="sl"; a.textContent=it.label;
      const b=document.createElement("div"); b.className="ss"; b.textContent=it.sub;
      d.appendChild(a); d.appendChild(b);
      d.addEventListener("pointerdown",(e)=>{ e.preventDefault();
        $("#zip").value=it.label;
        if(it.picked) state.picked=Object.assign({}, it.picked, {key:it.label.toLowerCase()});
        hideSuggest();
      });
      box.appendChild(d);
    });
    box.style.display="block";
  }
  $("#zip").addEventListener("input", ()=>{
    const v=$("#zip").value;
    if(state.picked && v.trim().toLowerCase()!==state.picked.key) state.picked=null;
    const q=v.trim().toLowerCase();
    if(/^\d/.test(q)||q.length<3){ hideSuggest(); return; }
    const local=[];
    hideSuggest();
    clearTimeout(sugTimer); const seq=++sugSeq;
    sugTimer=setTimeout(async()=>{
      try{
        const r=await fetch("https://photon.komoot.io/api/?q="+encodeURIComponent(v.trim())+"&limit=6&lang=en");
        const j=await r.json(); if(seq!==sugSeq) return;
        const seen=new Set(local.map(x=>x.label.toLowerCase()));
        const items=(j.features||[]).filter(f=>f.properties&&f.properties.countrycode==="US").map(f=>{
          const pr=f.properties, cc=f.geometry.coordinates;
          const nm=pr.name||pr.city||""; if(!nm) return null;
          const label=nm+(pr.state?", "+pr.state:"");
          if(seen.has(label.toLowerCase())) return null; seen.add(label.toLowerCase());
          const sub=[(pr.city&&pr.city!==nm)?pr.city:null, pr.postcode||null].filter(Boolean).join(" \u00B7 ")||t("tapUse");
          return {label:label, sub:sub, picked:{lat:cc[1], lon:cc[0], label:label, postcode:pr.postcode||null}};
        }).filter(Boolean);
        renderSuggest(local.concat(items));
      }catch(e){}
    },280);
  });
  $("#zip").addEventListener("blur", ()=>setTimeout(hideSuggest,200));
  async function roll(){
    hideSuggest();
    const raw=$("#zip").value.trim();
    const isZip=/^\d{5}$/.test(raw);
    if(!isZip && raw.replace(/[^a-zA-Z ]/g,"").trim().length<2){ $("#zipNote").textContent=t("needInput"); return; }
    state.zip=raw; $("#rollBtn").disabled=true; $("#rollBtn").textContent=t("rolling");
    try{
      if(!state.places.length || state._zipLoaded!==raw.toLowerCase()){ await ensurePlaces(raw); state._zipLoaded=raw.toLowerCase(); }
      applyWeather();
      if(!state.places.length){ $("#zipNote").textContent=t("noSpots"); return; }
      $("#zipNote").textContent="";
      const plan=buildPlan(state.places,state.filters,state.lockedMain);
      if(!plan){ $("#zipNote").textContent=t("noPlan"); return; }
      state.plan=plan; renderPlan(); saveHistory();
    }catch(e){
      $("#zipNote").textContent=t("hiccup");
    }finally{ $("#rollBtn").disabled=false; $("#rollBtn").textContent=t("roll"); }
  }
  $("#rollBtn").onclick=roll;
  $("#againBtn").onclick=roll;
  $("#zip").addEventListener("keydown",(e)=>{ if(e.key==="Enter") roll(); });
  $("#lockBtn").onclick=()=>{ state.lockedMain=state.lockedMain?null:(state.plan?state.plan.main:null); renderPlan(); };
  $("#copyBtn").onclick=async()=>{
    if(!state.plan) return;
    const txt=planText(state.plan,state.zip);
    try{ await navigator.clipboard.writeText(txt); $("#copyBtn").textContent=t("copied"); setTimeout(()=>$("#copyBtn").textContent=t("copy"),1500); }
    catch(e){ $("#copyBtn").textContent=t("copyBlocked"); }
  };
  $("#locBtn").onclick=()=>{
    if(!navigator.geolocation){ $("#zipNote").textContent=t("locNA"); return; }
    $("#zipNote").textContent=t("gettingLoc");
    navigator.geolocation.getCurrentPosition(async(pos)=>{
      try{
        const {latitude:lat,longitude:lon}=pos.coords;
        const r=await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`);
        const j=await r.json(); const zip=(j.address&&j.address.postcode||"").slice(0,5);
        const cityName=(j.address&&(j.address.city||j.address.town||j.address.village))||"";
        if(zip){ $("#zip").value=zip; roll(); } else if(cityName){ $("#zip").value=cityName; roll(); } else $("#zipNote").textContent=t("locFailCity");
      }catch(e){ $("#zipNote").textContent=t("locFail"); }
    },()=>{ $("#zipNote").textContent=t("locDenied"); });
  };
}

/* Node/test export */
if(typeof module!=="undefined" && module.exports){ module.exports={CATS,CAT_BLURBS,CAT_BLURBS_ES,SEED_INFO,SEED_INFO_ES,setLang:(l)=>{WD_LANG=l;},getLang:()=>WD_LANG,catLabel,catFromTags,placesFromElements,seedForZip,seedForCity,seedForQuery,buildPlan,planText,placeOK,DEFAULT_FILTERS,haversineMi,fetchPlaces,geocodeZip,geocodeCity,pickGeocodeResult,SEED_CENTERS}; }
</script>
