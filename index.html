<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<title>What Do? — Things To Do Roulette</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#f7f5f0; --card:#ffffff; --ink:#1d1d22; --muted:#6d6d76;
  --accent:#0aa88a; --accent2:#7c4dff; --line:#e5e1d8; --chip:#eceae3;
  --shadow:0 10px 30px rgba(20,20,30,.10);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#222227; --card:#2e2e34; --ink:#f2f1ec; --muted:#a9a9b2; --line:#45454c; --chip:#3b3b43; --shadow:0 10px 30px rgba(0,0,0,.35); }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink);}
.wrap{max-width:560px; margin:0 auto; padding:18px 16px 40px; position:relative;}
@media(min-width:760px){ .wrap{padding-top:24px;} }

/* hamburger */
#menuBtn{position:fixed; top:14px; left:14px; z-index:60; width:46px; height:46px; border-radius:50%; border:1px solid var(--line); background:var(--card); box-shadow:var(--shadow); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;}
#menuBtn span{display:block; width:20px; height:2.5px; border-radius:2px; background:var(--ink);}
#menuBtn span:nth-child(2){width:14px; margin-right:6px; background:var(--accent);}

.logo{text-align:center; margin:26px 0 2px; font-size:44px; font-weight:900; letter-spacing:-1px;}
.logo .q{background:linear-gradient(120deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.tagline{text-align:center; color:var(--muted); margin:0 0 20px; font-size:15px;}

.zipRow{display:flex; gap:8px; justify-content:center; margin-bottom:10px;}
#zip{width:150px; padding:13px 14px; font-size:18px; text-align:center; border-radius:14px; border:1.5px solid var(--line); background:var(--card); color:var(--ink); outline:none;}
#zip:focus{border-color:var(--accent);}
#locBtn{padding:13px 14px; font-size:14px; border-radius:14px; border:1.5px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer;}
#zipNote{text-align:center; color:var(--muted); font-size:13px; min-height:18px; margin-bottom:8px;}
#wxPill{text-align:center; font-size:13px; color:var(--muted); margin-bottom:6px; min-height:16px;}

#rollBtn{display:block; width:100%; padding:19px; font-size:24px; font-weight:900; letter-spacing:.3px; color:#fff; border:none; border-radius:18px; cursor:pointer; background:linear-gradient(120deg,var(--accent),var(--accent2)); box-shadow:var(--shadow);}
#rollBtn:active{transform:scale(.985);}
#rollBtn:disabled{opacity:.55;}
#filterSummary{text-align:center; color:var(--muted); font-size:13px; margin:10px 4px 0; min-height:16px;}

/* result */
#result{margin-top:20px; display:none;}
.planCard{background:var(--card); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow); overflow:hidden;}
.planHead{padding:14px 18px; background:linear-gradient(120deg, rgba(10,168,138,.14), rgba(124,77,255,.14)); display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;}
.planHead .ttl{font-weight:800; font-size:16px;}
.pill{font-size:12px; padding:4px 9px; border-radius:999px; background:var(--chip); color:var(--ink); white-space:nowrap;}
.stop{padding:15px 18px; border-top:1px solid var(--line);}
.stop:first-of-type{border-top:none;}
.stopLabel{font-size:11px; font-weight:800; letter-spacing:1.2px; color:var(--accent); text-transform:uppercase; margin-bottom:3px;}
.stopLabel.side{color:var(--accent2);}
.stopLabel.closer{color:#e08a00;}
.stopName{font-size:20px; font-weight:800; line-height:1.2; overflow-wrap:anywhere;}
.stopMeta{color:var(--muted); font-size:13.5px; margin-top:3px; line-height:1.45; overflow-wrap:anywhere;}
.stopMeta a{color:var(--accent); text-decoration:none; font-weight:600;}
.stop{cursor:pointer;}
.tapHint{font-size:12px; color:var(--accent); font-weight:700; margin-top:5px;}
.detail{display:none; margin-top:10px; padding:11px 12px; background:var(--chip); border-radius:12px; font-size:14px; line-height:1.5;}
.detail.open{display:block;}
.detail .dInfo{margin-bottom:8px;}
.detail .dRow{color:var(--muted); font-size:13px; margin-bottom:3px;}
.detail .dLinks{margin-top:8px; display:flex; gap:12px; flex-wrap:wrap;}
.detail .dLinks a{color:var(--accent); font-weight:700; text-decoration:none; font-size:14px;}
.totals{display:flex; gap:8px; padding:14px 18px; border-top:1px solid var(--line); flex-wrap:wrap;}
.totalBox{flex:1; min-width:0; text-align:center; background:var(--chip); border-radius:12px; padding:9px 4px;}
.totalBox b{display:block; font-size:17px;}
.totalBox small{color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.6px;}
.btnRow{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
.btn{flex:1; min-width:120px; padding:14px 10px; font-size:16px; font-weight:700; border-radius:14px; border:1.5px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer;}
.btn.primary{background:linear-gradient(120deg,var(--accent),var(--accent2)); color:#fff; border:none;}
.btn.on{border-color:var(--accent2); color:var(--accent2);}

/* history */
#historyBox{margin-top:22px; display:none;}
#historyHead{cursor:pointer; font-weight:800; font-size:15px; padding:8px 2px; user-select:none;}
.histItem{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px; font-size:14px;}
.histItem small{color:var(--muted);}

/* drawer */
#scrim{position:fixed; inset:0; background:rgba(0,0,0,.38); z-index:70; opacity:0; pointer-events:none; transition:opacity .22s;}
#scrim.open{opacity:1; pointer-events:auto;}
#drawer{position:fixed; top:0; left:0; bottom:0; width:min(88vw,330px); background:var(--card); z-index:80; transform:translateX(-105%); transition:transform .24s; padding:20px 18px 30px; overflow-y:auto; box-shadow:6px 0 24px rgba(0,0,0,.2);}
#drawer.open{transform:translateX(0);}
#drawer h2{margin:2px 0 14px; font-size:20px;}
.fGroup{margin-bottom:16px;}
.fGroup h3{font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin:0 0 8px;}
.chips{display:flex; flex-wrap:wrap; gap:7px;}
.chip{padding:8px 12px; border-radius:999px; background:var(--chip); border:1.5px solid transparent; font-size:14px; cursor:pointer; color:var(--ink);}
.chip.sel{border-color:var(--accent); background:rgba(10,168,138,.14); font-weight:700;}
#drawerClose{width:100%; padding:13px; border:none; border-radius:12px; background:linear-gradient(120deg,var(--accent),var(--accent2)); color:#fff; font-weight:800; font-size:15px; cursor:pointer; margin-top:4px;}
.foot{text-align:center; color:var(--muted); font-size:12px; margin-top:28px; line-height:1.5;}

  #mapWrap{display:none;margin-top:12px;}
  #map{height:330px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--chip);}
  .pinNum{width:28px;height:28px;border-radius:50%;background:#0aa88a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);}
  .leaflet-container{font:inherit;}

  #suggest{display:none;text-align:left;max-width:520px;margin:0 auto 8px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);}
  .sugItem{padding:12px 14px;cursor:pointer;border-bottom:1px solid var(--line);}
  .sugItem:last-child{border-bottom:none;}
  .sugItem:active{background:var(--chip);}
  .sugItem .sl{font-weight:600;font-size:15px;}
  .sugItem .ss{color:var(--muted);font-size:12px;margin-top:1px;}

  #grubLink{position:fixed;left:12px;bottom:12px;z-index:60;display:flex;align-items:center;gap:8px;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:7px 13px 7px 9px;box-shadow:var(--shadow);text-decoration:none;}
  #grubLink svg{flex:none;color:var(--accent);}
  #grubLink .gT{display:flex;flex-direction:column;line-height:1.15;}
  #grubLink .gT small{color:var(--muted);font-size:10.5px;}
  #grubLink .gT b{font-size:13px;}

  .topRow{display:flex;justify-content:flex-end;margin-bottom:2px;}
  #langToggle{display:flex;align-items:center;gap:6px;background:var(--card);color:var(--muted);border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;}
  #langToggle span.on{color:var(--accent);font-weight:800;}
  #langToggle .lsep{opacity:.4;}
</style>
</head>
<body>
<button id="menuBtn" aria-label="Filters"><span></span><span></span><span></span></button>

<div class="wrap">
  <div class="topRow"><button id="langToggle" type="button" aria-label="Language / Idioma"><span data-l="en">EN</span><span class="lsep">|</span><span data-l="es">ES</span></button></div>
  <div class="logo">What Do<span class="q">?</span></div>
  <p class="tagline" id="tagline">What's there to do around here?</p>

  <div class="zipRow">
    <input id="zip" autocomplete="off" placeholder="ZIP or city name" maxlength="40">
    <button id="locBtn" type="button">Use my location</button>
  </div>
  <div id="suggest"></div>
  <div id="zipNote"></div>
  <div id="wxPill"></div>

  <button id="rollBtn" type="button">WHAT DO? 🎲</button>
  <div id="filterSummary"></div>

  <div id="result">
    <div class="planCard" id="planCard"></div>
    <div id="mapWrap"><div id="map"></div></div>
    <div class="btnRow">
      <button class="btn primary" id="againBtn" type="button">Roll Again 🎲</button>
      <button class="btn" id="lockBtn" type="button">Lock Main Event</button>
    </div>
    <div class="btnRow">
      <button class="btn" id="copyBtn" type="button">Copy Plan to Text</button>
      <button class="btn" id="mapBtn" type="button">View on Map 🗺</button>
    </div>
  </div>

  <div id="historyBox">
    <div id="historyHead"><span id="histLabel">History</span> <span id="histToggle">[+]</span></div>
    <div id="historyList" style="display:none;"></div>
  </div>

  <p class="foot" id="footNote">Places come from live OpenStreetMap data (plus a few hand-picked starters).<br>Costs &amp; times are estimates — check hours before you roll out.</p>
</div>

<a id="grubLink" href="https://orlandochaidez.com/grubroulette/" target="_blank" rel="noopener" aria-label="Hungry? Try GrubRoulette">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M3.5 10.5c0-4.2 3.8-6.8 8.5-6.8s8.5 2.6 8.5 6.8"/>
    <path d="M9.2 7h.01M12.8 6.4h.01M15.8 7.6h.01"/>
    <path d="M3 13.6c1.8-1.4 3.6 1.4 5.4 0 1.8-1.4 3.6 1.4 5.4 0 1.8-1.4 3.6 1.4 5.4 0"/>
    <path d="M4.6 17h14.8"/>
    <path d="M4 19.6c0 .9.7 1.6 1.6 1.6h12.8c.9 0 1.6-.7 1.6-1.6"/>
  </svg>
  <span class="gT"><small id="gSmall">Hungry?</small><b id="gBold">Try GrubRoulette</b></span>
</a>
<div id="scrim"></div>
<aside id="drawer" aria-label="Filters">
  <h2 id="dFilters">Filters</h2>
  <div class="fGroup"><h3 id="dWho">Who's going?</h3><div class="chips" id="fWho"></div></div>
  <div class="fGroup"><h3 id="dVibe">Vibe</h3><div class="chips" id="fVibe"></div></div>
  <div class="fGroup"><h3 id="dBudget">Budget (per person)</h3><div class="chips" id="fBudget"></div></div>
  <div class="fGroup"><h3 id="dTime">Time you got</h3><div class="chips" id="fTime"></div></div>
  <div class="fGroup"><h3 id="dSetting">Setting</h3><div class="chips" id="fSetting"></div></div>
  <button id="drawerClose" type="button">Done</button>
</aside>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";
/* ================= What Do? — core engine (pure, testable) ================= */
const $ = (s)=>document.querySelector(s);
let WD_LANG="en";
try{ WD_LANG = localStorage.getItem("whatdo_lang") || (((navigator.language||"en").toLowerCase().indexOf("es")===0)?"es":"en"); }catch(e){}
function catLabel(c){ const cm=CATS[c]; return (WD_LANG==="es"&&cm&&cm.labelEs)?cm.labelEs:(cm?cm.label:""); }

function haversineMi(aLat,aLon,bLat,bLon){
  const R=3958.8, dLa=(bLat-aLat)*Math.PI/180, dLo=(bLon-aLon)*Math.PI/180;
  const s=Math.sin(dLa/2)**2 + Math.cos(aLat*Math.PI/180)*Math.cos(bLat*Math.PI/180)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
const rnd = (n)=>Math.floor(Math.random()*n);
function pick(arr){ return arr[rnd(arr.length)]; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* Category model: dur = typical minutes, cost = est $/person, io = in/out/both */
const CATS = {
  park:      {label:"Park", labelEs:"Parque", icon:"🌳", dur:75,  cost:0,  io:"out", vibes:["chill","outdoors","active"], who:["solo","date","friends","family"]},
  garden:    {label:"Garden", labelEs:"Jardín", icon:"🌷", dur:60,  cost:5,  io:"out", vibes:["chill","outdoors","artsy"], who:["solo","date","family"]},
  viewpoint: {label:"Viewpoint", labelEs:"Mirador", icon:"🌇", dur:30,  cost:0,  io:"out", vibes:["chill","outdoors"], who:["solo","date","friends","family"]},
  museum:    {label:"Museum", labelEs:"Museo", icon:"🏛️", dur:120, cost:15, io:"in",  vibes:["artsy","chill","tourist"], who:["solo","date","friends","family"]},
  gallery:   {label:"Art Gallery", labelEs:"Galería de arte", icon:"🎨", dur:60,  cost:0,  io:"in",  vibes:["artsy","chill"], who:["solo","date","friends"]},
  zoo:       {label:"Zoo / Aquarium", labelEs:"Zoológico / Acuario", icon:"🦁", dur:150, cost:22, io:"both",vibes:["outdoors","tourist"], who:["date","friends","family"]},
  attraction:{label:"Attraction", labelEs:"Atracción", icon:"🎡", dur:120, cost:18, io:"both",vibes:["tourist","active"], who:["date","friends","family"]},
  cinema:    {label:"Movie Theater", labelEs:"Cine", icon:"🎬", dur:130, cost:14, io:"in",  vibes:["chill","nightlife"], who:["solo","date","friends","family"]},
  theatre:   {label:"Theatre", labelEs:"Teatro", icon:"🎭", dur:120, cost:25, io:"in",  vibes:["artsy","nightlife"], who:["date","friends"]},
  bowling:   {label:"Bowling", labelEs:"Boliche", icon:"🎳", dur:90,  cost:15, io:"in",  vibes:["active","nightlife"], who:["date","friends","family"]},
  minigolf:  {label:"Mini Golf", labelEs:"Minigolf", icon:"⛳", dur:60,  cost:12, io:"out", vibes:["active"], who:["date","friends","family"]},
  sports:    {label:"Sports / Rec", labelEs:"Deportes / Recreación", icon:"🏀", dur:90,  cost:10, io:"both",vibes:["active"], who:["solo","friends","family"]},
  ice:       {label:"Ice Rink", labelEs:"Pista de hielo", icon:"⛸️", dur:90,  cost:14, io:"in",  vibes:["active"], who:["date","friends","family"]},
  playground:{label:"Playground", labelEs:"Juegos infantiles", icon:"🛝", dur:60,  cost:0,  io:"out", vibes:["outdoors","active"], who:["family"]},
  library:   {label:"Library", labelEs:"Biblioteca", icon:"📚", dur:60,  cost:0,  io:"in",  vibes:["chill","artsy"], who:["solo","family"]},
  nature:    {label:"Nature / Trail", labelEs:"Naturaleza / Senderos", icon:"🥾", dur:120, cost:0,  io:"out", vibes:["outdoors","active","chill"], who:["solo","date","friends","family"]},
  beach:     {label:"Beach / Lake", labelEs:"Playa / Lago", icon:"🏖️", dur:150, cost:0,  io:"out", vibes:["outdoors","chill"], who:["date","friends","family"]},
  market:    {label:"Market", labelEs:"Mercado", icon:"🧺", dur:60,  cost:10, io:"both",vibes:["tourist","chill"], who:["solo","date","friends","family"]},
  cafe:      {label:"Café / Dessert", labelEs:"Café / Postres", icon:"🍦", dur:40,  cost:8,  io:"in",  vibes:["chill"], who:["solo","date","friends","family"]},
  nightlife: {label:"Nightlife", labelEs:"Vida nocturna", icon:"🎤", dur:120, cost:20, io:"in",  vibes:["nightlife","active"], who:["date","friends"]},
  generic:   {label:"Spot", labelEs:"Lugar", icon:"📍", dur:60,  cost:10, io:"both",vibes:["chill"], who:["solo","date","friends","family"]}
};
const CAT_BLURBS = {
  park:"A park — open green space, usually free. Good for a walk, a picnic, or just hanging out.",
  garden:"A garden or conservatory — plants, paths, and a slow pace.",
  viewpoint:"A viewpoint or overlook — go for the view, especially near sunset.",
  museum:"A museum — exhibits indoors, expect about the time shown. The dollar figure is a rough ticket estimate.",
  gallery:"An art gallery or arts center — usually free or cheap to browse.",
  zoo:"A zoo or aquarium — animals and exhibits; the dollar figure is a rough ticket estimate.",
  attraction:"A local attraction or landmark — the kind of place visitors get taken to. The dollar figure is a rough per-person estimate.",
  cinema:"A movie theater — check showtimes before you roll out.",
  theatre:"A theater or performance venue — check what's on; many only open for shows.",
  bowling:"A bowling alley — games plus shoe rental usually land near the estimate.",
  minigolf:"Mini golf — a round usually takes about an hour.",
  sports:"A sports or recreation center — courts, fields, or drop-in activities.",
  ice:"An ice rink — public skate sessions usually land near the estimate, skates included.",
  playground:"A playground — a let-the-kids-burn-energy stop.",
  library:"A public library — quiet, free, and often hosting events.",
  nature:"Nature — trails, reserves, or wild coast. Bring water and check the weather.",
  beach:"A beach — sand, water, and however long you feel like staying.",
  market:"A market — stalls, food, and local stuff to browse.",
  cafe:"A cafe or dessert spot — the classic low-stakes closer.",
  nightlife:"Nightlife — music, karaoke, or a late scene. Best with the 21+ crew.",
  generic:"A local spot pulled from the map — tap 'Look it up' to see photos, reviews, and hours."
};
const CAT_BLURBS_ES = {
 "park": "Un parque — espacio verde abierto, casi siempre gratis. Bueno para caminar, un picnic o nomás pasar el rato.",
 "garden": "Un jardín o invernadero — plantas, senderos y ritmo tranquilo.",
 "viewpoint": "Un mirador — ve por la vista, sobre todo cerca del atardecer.",
 "museum": "Un museo — exhibiciones bajo techo, calcula el tiempo que se muestra. El costo es un estimado aproximado del boleto.",
 "gallery": "Una galería de arte o centro cultural — casi siempre gratis o barato para entrar a ver.",
 "zoo": "Un zoológico o acuario — animales y exhibiciones; el costo es un estimado aproximado del boleto.",
 "attraction": "Una atracción o lugar emblemático local — de esos a los que llevan a las visitas. El costo es un estimado aproximado por persona.",
 "cinema": "Un cine — checa los horarios antes de salir.",
 "theatre": "Un teatro o foro de espectáculos — checa la cartelera; muchos solo abren cuando hay función.",
 "bowling": "Un boliche — los juegos y la renta de zapatos suelen quedar cerca del estimado.",
 "minigolf": "Minigolf — una ronda suele tardar como una hora.",
 "sports": "Un centro deportivo o recreativo — canchas, campos o actividades sin reservar.",
 "ice": "Una pista de hielo — la sesión pública suele quedar cerca del estimado, patines incluidos.",
 "playground": "Un área de juegos — la parada para que los niños quemen energía.",
 "library": "Una biblioteca pública — tranquila, gratis, y seguido con eventos.",
 "nature": "Naturaleza — senderos, reservas o costa. Lleva agua y checa el clima.",
 "beach": "Una playa o lago — arena, agua, y el tiempo que quieras quedarte.",
 "market": "Un mercado — puestos, comida y cosas locales para curiosear.",
 "cafe": "Un café o lugar de postres — el cierre clásico sin complicaciones.",
 "nightlife": "Vida nocturna — música, karaoke o ambiente tarde. Mejor con el grupo de 21+.",
 "generic": "Un lugar sacado del mapa — toca 'Buscar' para ver fotos, reseñas y horarios."
};
const CLOSER_CATS = ["viewpoint","cafe","garden","park","gallery","market"];
const MAIN_CATS   = ["zoo","attraction","museum","park","nature","cinema","bowling","sports","beach","theatre","minigolf","ice"];

function catFromTags(t){
  const L=t.leisure||"", T=t.tourism||"", A=t.amenity||"", N=t.natural||"";
  if(L==="park"||L==="common"||L==="dog_park") return "park";
  if(L==="garden"||T==="garden") return "garden";
  if(T==="viewpoint") return "viewpoint";
  if(T==="museum") return "museum";
  if(T==="gallery"||A==="arts_centre") return "gallery";
  if(T==="zoo"||T==="aquarium") return "zoo";
  if(T==="attraction"||T==="theme_park") return "attraction";
  if(A==="cinema") return "cinema";
  if(A==="theatre") return "theatre";
  if(L==="bowling_alley"||A==="bowling_alley") return "bowling";
  if(L==="miniature_golf") return "minigolf";
  if(L==="ice_rink") return "ice";
  if(L==="playground") return "playground";
  if(L==="sports_centre"||L==="fitness_centre"||L==="pitch") return "sports";
  if(A==="library") return "library";
  if(L==="nature_reserve"||N==="wood"||N==="peak") return "nature";
  if(N==="beach"||L==="beach_resort") return "beach";
  if(A==="marketplace") return "market";

function addrFromTags(t){
  const parts=[t["addr:housenumber"],t["addr:street"]].filter(Boolean).join(" ");
  return parts || t["addr:street"] || "";
}

function placesFromElements(elements, cLat, cLon){
  const out=[], seen=new Set();
  for(const el of (elements||[])){
    const t=el.tags||{}; if(!t.name) continue;
    const lat=el.lat!=null?el.lat:(el.center&&el.center.lat), lon=el.lon!=null?el.lon:(el.center&&el.center.lon);
    if(lat==null||lon==null) continue;
    const key=t.name.toLowerCase()+"@"+lat.toFixed(3)+","+lon.toFixed(3);
    if(seen.has(key)) continue; seen.add(key);
    const cat=catFromTags(t), cm=CATS[cat]||CATS.generic;
    const dist=haversineMi(cLat,cLon,lat,lon);
    if(dist>15) continue;
    out.push({name:t.name, cat, lat, lon, dist:Math.round(dist*10)/10, addr:addrFromTags(t),
      dur:cm.dur, cost:cm.cost, io:cm.io, vibes:cm.vibes.slice(), who:cm.who.slice(), src:"live",
      website:t.website||t["contact:website"]||"", hours:t.opening_hours||"", info:""});
  }
  return out.sort((a,b)=>a.dist-b.dist);
}

 "Echo Park Lake": "Lago bonito con botes de pedales para rentar, flores de loto en verano y vista directa al skyline del centro.",
 "The Broad": "Museo de arte contemporáneo gratis en el centro (reserva boletos antes) — los cuartos Infinity Mirror que brillan son la atracción principal.",
 "LACMA": "El museo de arte más grande de LA. La escultura de lámparas Urban Light de la entrada es gratis para visitar a cualquier hora.",
 "Santa Monica Pier": "Muelle clásico de playa con un parquecito de juegos mecánicos (Pacific Park), un acuario debajo, pesca y atardeceres.",
 "Venice Beach Boardwalk": "El famoso malecón — pista de patinaje, el gimnasio Muscle Beach, artistas callejeros, vendedores y murales.",
 "The Getty Center": "Museo de arte gratis en la colina, con jardines y vistas panorámicas de la ciudad — solo pagas el estacionamiento.",
 "Elysian Park": "Uno de los parques más antiguos de LA, junto al Dodger Stadium — senderos con sombra y miradores al skyline, casi siempre tranquilo.",
 "Millennium Park & Cloud Gate": "Parque céntrico construido alrededor de 'The Bean' — más la Crown Fountain, jardines y conciertos gratis en verano.",
 "Art Institute of Chicago": "Uno de los mejores museos de arte del mundo — Monet, Seurat y el Gótico americano viven aquí.",
 "Chicago Riverwalk": "Malecón a orillas del río, lleno de cafés y jardines de vino — de aquí salen los tours en barco de arquitectura.",
 "Navy Pier": "Muelle a orillas del lago con la enorme Centennial Wheel, cruceros, jardines y fuegos artificiales dos veces por semana en verano.",
 "Lincoln Park Zoo": "Un zoológico de verdad y totalmente gratis, abierto todos los días del año.",
 "Shedd Aquarium": "Acuario enorme junto al lago — ballenas beluga, pingüinos, delfines y un arrecife de tiburones.",
 "Maggie Daley Park": "Paraíso de juegos junto a Millennium Park — muros para escalar, una pista de patinaje sinuosa y minigolf en verano.",
 "Garfield Park Conservatory": "Invernadero botánico interior gigantesco y gratis — selvas enteras bajo vidrio, abierto todo el año.",
 "Mission San Luis Obispo de Tolosa": "Misión española fundada en 1772, en pleno centro — todavía es iglesia activa, con un museo pequeño y la plaza junto al arroyo al frente.",
 "Bubblegum Alley": "Exactamente lo que suena: un callejón angosto del centro con las paredes tapizadas de décadas de chicle masticado. Asqueroso, famoso, dura dos minutos.",
 "Madonna Inn": "SÍ, es un hotel — uno kitsch a más no poder, de 1958, con 110 cuartos temáticos (cuarto de cavernícola, todo rosa) y un famoso mingitorio de cascada. No tienes que hospedarte: la gente visita para recorrerlo, ir a la panadería/steakhouse y ver la decoración. Los ~$18 indicados son un estimado de visita y comida, NO el precio del cuarto.",
 "Bishop Peak": "Sube el punto más alto de SLO (1,559 pies) — cumbre rocosa con vistas enormes, unas 3.5 millas ida y vuelta.",
 "Cerro San Luis Obispo": "La montaña con la 'M', justo a la orilla del centro — la caminata favorita de los locales, con vistas a la ciudad y el océano.",
 "San Luis Obispo Museum of Art": "Museo de arte pequeño y gratis junto a la misión, con exhibiciones rotativas de arte de California.",
 "San Luis Obispo Children's Museum": "Tres pisos de exhibiciones interactivas para que los niños jueguen — ideal para menores de 10 años.",
 "Sunset Drive-In Theatre": "Un autocinema de verdad que todavía funciona — uno de los últimos en California. Función doble, casi siempre en fines de semana, abre al anochecer.",
 "Laguna Lake Park": "Parque con lago, juegos, campo de disc golf, parque para perros y acceso al sendero del Cerro San Luis.",
 "El Chorro Regional Park": "Parque del condado entre SLO y Morro Bay — áreas grandes de picnic, canchas, juegos y un jardín botánico.",
 "San Luis Obispo Railroad Museum": "Museo de historia ferroviaria en la antigua casa de carga junto a la estación de Amtrak — trenes a escala y vagones reales.",
 "Dallidet Adobe and Gardens": "Una casa-museo de adobe de los 1850 escondida en un jardín tranquilo — una joyita escondida en el centro, sin prisas.",
 "Avila Beach": "Pueblito de playa en una caleta protegida — el agua es más calmada y cálida que en Pismo, con muelle y un malecón de cafés frente a la playa.",
 "Bob Jones Trail": "Sendero pavimentado 'City to the Sea' que sigue el arroyo desde la orilla de SLO hasta Avila Beach — camínalo o en bici, casi todo plano y con sombra.",
 "Pirate's Cove": "Mirador en el acantilado sobre una caleta cerca de Avila — cueva marina con marea baja y vistas grandes al atardecer. (Un extremo de la playa es opcional de ropa.)",
 "Pismo Beach Pier": "Muelle largo de madera en el corazón del Pismo clásico — mira a los surfistas, pesca desde el final y luego date la vuelta a la zona playera.",
 "Monarch Butterfly Grove": "De octubre a febrero, más o menos, decenas de miles de mariposas monarca se juntan en estos eucaliptos. Gratis, y en temporada es algo impresionante.",
 "Dinosaur Caves Park": "Parque sobre el acantilado en Shell Beach con un área de juegos grande, jardines y vistas desde el borde. Las cuevas que le dan nombre están bajo los acantilados.",
 "Margo Dodd Park": "Parquecito de pasto sobre el océano en Shell Beach — bancas, atardeceres y avistamiento de ballenas en temporada.",
 "Price Historical Park": "Parquecito histórico y tranquilo alrededor de la Price Anniversary House de los 1890, una de las casas más antiguas de Pismo.",
 "Oceano Dunes": "La única playa de California donde puedes manejar — entra en la arena, acampa o renta una cuatrimoto cerca. Aplica cobro por vehículo.",
 "Eldwayen Ocean Park": "Parque de pasto en lo alto del acantilado, sobre las pozas de marea en Shell Beach — mesas de picnic y atardeceres.",
 "Boosinger Park": "Parque de barrio en Pismo con vistas al océano, juegos y canchas de tenis.",
 "Spyglass Park": "Parque en lo alto del acantilado en Shell Beach, con áreas de picnic colgando sobre el agua.",
 "Chumash Park": "Parque amplio tierra adentro en Pismo, con canchas, juegos y campos deportivos.",
 "Shell Beach": "La franja de acantilados al norte de Pismo — caletas pequeñas, pozas de marea con marea baja y bancas para el atardecer por Shell Beach Road.",
 "Avila Beach Pier": "El muelle de madera del pueblo — camínalo, busca leones marinos abajo, y la playa está ahí mismo cuando termines.",
 "Avila Valley Barn": "Puesto de granja queridísimo en el camino a Avila — pays recién horneados, productos locales, animales para alimentar y un laberinto de paja en otoño. Muy familiar; los locales juran por los pays.",
 "Avila Hot Springs": "Aguas termales a la antigua (desde 1907) sobre Avila Beach Drive — una alberca grande de agua caliente para remojarse y una de agua dulce con tobogán. El costo indicado es el estimado de la entrada.",
 "Sycamore Mineral Springs": "Jacuzzis de agua mineral escondidos entre los encinos de la ladera, que se rentan por hora, más spa, jardines y una alberca tipo laguna. Plan de relax / cita de primer nivel.",
 "Point San Luis Lighthouse": "Un faro de 1890 en la punta — llegas en tours guiados (normalmente miércoles y sábados, en tranvía desde Avila). Checa el día del tour antes de salir; las vistas son enormes.",
 "Ontario Ridge Trail": "Caminata empinada por la cresta, favorita de los locales, entre Avila y Shell Beach — subida corta que se paga con vistas al océano de pared a pared.",
 "Maya Cinemas": "Cine sobre California Ave con asientos reclinables tipo lounge — la opción de asientos cómodos en la ciudad.",
 "Studio Movie Grill": "Cine con cena junto a River Walk — menú completo y bebidas servidas hasta tu asiento.",
 "Regal Edwards Bakersfield": "El cine grande con IMAX sobre Rosedale Highway — el lugar para los estrenos.",
 "Bowlero Bakersfield": "Boliche en Wible Road (el antiguo Southwest Lanes, totalmente remodelado) — líneas, maquinitas y comida de bar.",
 "The BLVD": "Centro de entretenimiento en Buck Owens Blvd — boliche, maquinitas enormes, laser tag, cuerdas altas y restaurante, todo bajo un mismo techo.",
 "Rollerama": "Pista de patinaje sobre ruedas a la antigua — sesiones públicas y renta de patines. Energía de fiesta de cumpleaños en su máximo, en el buen sentido.",
 "Bakersfield Ice Sports Center": "La pista de hielo de la ciudad, justo al este del centro (hoy Valley Children's Ice Center) — patinaje público, rentas, hockey y clases.",
 "Buck Owens Crystal Palace": "El Crystal Palace de Buck Owens — steakhouse y salón de música country en vivo, con el famoso Pontiac de Buck colgando sobre la barra. Una institución de Bakersfield: mitad cena, mitad show.",
 "Dignity Health Arena": "La arena grande del centro — hockey de los Condors, conciertos y shows grandes. Depende de eventos, así que checa el calendario antes de salir.",
 "Bakersfield Community Theatre": "Teatro comunitario desde 1927 — uno de los más antiguos de California — con producciones locales en South Chester Ave.",
 "Bakersfield Speedway": "Carreras en óvalo de tierra en Oildale, desde 1946 — sprint cars y ruido de sábado por la noche, casi siempre de primavera a otoño.",
 "Sam Lynn Ballpark": "Estadio histórico de 1941 — uno de los parques de ligas menores más antiguos del país. Aquí salen juegos y eventos; checa el calendario.",
 "Beach Park": "Parque junto al río Kern en Truxtun — inicio de la ciclovía del río, con jardines, voleibol y espacio para picnic.",
 "Jastro Park": "Uno de los parques más antiguos de la ciudad, justo al oeste del centro — árboles grandes con sombra, juegos, tenis y un anfiteatro pequeño.",
 "Yokuts Park": "Parque verde junto al río, sobre la ciclovía, en el suroeste — juegos, áreas de picnic techadas y espacio para extenderse.",
 "Patriots Park": "Parque de barrio grande en el suroeste — campos deportivos, canchas, juegos y áreas de picnic.",
 "Silver Creek Park": "Parque amplio del lado sur — espacios verdes, juegos y canchas deportivas.",
 "Lowell Park": "Parque de barrio tranquilo al sureste del centro — juegos, jardines y mesas de picnic.",
 "Lake Ming": "Lago del condado al noreste, sobre el río Kern — pesca, botes y picnics, con un campo de golf al lado. Más tranquilo que Hart Park.",
 "Beale Memorial Library": "La biblioteca principal del condado, en el centro — tres pisos de libros, eventos y exhibiciones seguido, y una sala de historia del condado de Kern.",
 "Valley Plaza Mall": "El centro comercial grande sobre Ming Ave — tiendas, área de comida y un cine adentro. Plan sólido para cuando hace demasiado calor afuera.",
 "Kaiser Permanente Sports Village": "Complejo deportivo enorme en el suroeste — canchas de fútbol y béisbol con torneos casi cada fin de semana.",
 "Links at RiverLakes Ranch": "Golf público en RiverLakes Ranch, al noroeste — 18 hoyos entre lagos, más un campo de práctica para una cubeta rápida de bolas. Los green fees cuestan más que el estimado genérico de deportes de la app.",
 "North Kern Golf Course": "Campo público del condado en el norte — green fees baratos y campo de práctica, si solo quieres pegarle a una cubeta de bolas.",
 "Kern River Golf Course": "Campo del condado junto a Lake Ming, sobre el río Kern — 18 hoyos, campo de práctica y greens de práctica. El bonito.",
 "Rio Bravo Country Club": "Campo de club campestre en las faldas del noreste, junto al río Kern — el campo más bonito de la ciudad. Checa la disponibilidad pública de horarios antes de ir.",
 "Sundale Country Club": "Campo de club en el suroeste con campo de práctica — checa la disponibilidad de horarios para invitados / público antes de ir.",
 "Easton Town Center": "Toda la plaza de Easton — un distrito enorme de compras y entretenimiento al aire libre, construido como su propio pueblito: tiendas, restaurantes, fuentes, artistas callejeros y gente sin parar. El plan por defecto de 'nomás ve a caminar a Easton'.",
 "LEGOLAND Discovery Center Columbus": "Parque interior de LEGO dentro de Easton — juegos mecánicos, zonas para construir y un Columbus mini hecho de LEGO. Parada 100% para niños y familia.",
 "Funny Bone Comedy Club": "Club de stand-up justo en Easton — comediantes nacionales de gira casi cada fin de semana. Checa la cartelera; las funciones son con boleto y casi siempre de noche.",
 "Pins Mechanical Co.": "Boliche duckpin + bar de maquinitas en Easton — juegos vintage, pinball, Jenga gigante y tragos. La opción de noche de juegos para adultos.",
 "Polaris Fashion Place": "El centro comercial grande de dos pisos en Polaris — más de 150 tiendas, área de comida, la corrida principal de compras del lado norte.",
 "Topgolf Columbus": "Topgolf en Polaris — cabinas de tiro climatizadas, blancos, comida y bebidas hasta tu cabina. No necesitas saber golf; a los grupos les encanta.",
 "Franklin Park Conservatory": "Jardines botánicos e invernaderos de cristal — biomas tropicales, la colección de vidrio de Chihuly y liberación de mariposas en temporada. El paseo interior-exterior más bonito de la ciudad.",
 "Otherworld": "Un parque de arte inmersivo enorme en el sureste — cuarto tras cuarto de instalaciones interactivas, brillantes y para treparse. Las fotos no le hacen justicia; reserva boletos antes en fines de semana.",
 "Ohio History Center": "El museo estatal de historia de Ohio, junto a los terrenos de la feria — exhibiciones desde mastodontes hasta los años 50, más el Ohio Village, un pueblo recreado de los 1860 afuera (por temporada).",
 "Inniswood Metro Gardens": "Un santuario-jardín de 123 acres en Westerville — jardines temáticos de flores, senderos en el bosque y un jardín para que los niños exploren. Gratis y pacífico.",
 "Sharon Woods Metro Park": "Parque metropolitano grande al norte — un lago para pescar y pasear en bote, millas de senderos y un área de juegos de aventura. Territorio clásico de picnic y caminata.",
 "Blendon Woods Metro Park": "Parque metropolitano boscoso justo al este de Easton — senderos por cañadas, un centro de naturaleza y disc golf. El respiro de naturaleza real más cercano a Easton.",
 "Creekside Park": "Parque y plaza sobre Big Walnut Creek en el centro de Gahanna — cascadas, botes de pedales en temporada y cafés sobre la plaza.",
 "Columbus Zoo and Aquarium": "Uno de los mejores zoológicos del país — más de 10,000 animales, regiones desde el Congo hasta la frontera polar, y el zoológico de casa de Jack Hanna. Aparta el día, es enorme.",
 "Zoombezi Bay": "El parque acuático del zoológico, al lado — toboganes, alberca de olas y río lento. Solo en verano, y hay boletos combinados con el zoológico.",
 "Star Lanes Polaris": "Boliche de nivel en Polaris — líneas boutique, maquinitas grandes y un bar deportivo. Boliche de cita, no de liga.",
 "Dave & Buster's": "El arcade grande de Polaris — juegos, premios, bar deportivo, todo el paquete. Come, toma y pierde en el air hockey.",
 "Magic Mountain Fun Center": "Centro de diversión familiar en Polaris — go-karts, dos campos de minigolf, lanchitas de choque y jaulas de bateo. Energía pura de caos en grupo.",
 "Marcus Crosswoods Cinema": "Cine en Crosswoods junto a la I-270 — asientos reclinables y el cine por defecto y fácil del lado norte.",
 "Ohio Railway Museum": "Trenes antiguos en Worthington — tranvías, locomotoras y paseos cortos en tren en días de apertura (casi siempre fines de semana, por temporada). Joya escondida para los fans de los trenes y los niños.",
 "Village Green": "El corazón del viejo Worthington — una plaza clásica estilo Nueva Inglaterra, con conciertos, mercados y festivales todo el año.",
 "Whetstone Park": "Parque grande de Clintonville sobre el río Olentangy — senderos, lago para pescar, campos deportivos y el Park of Roses adentro.",
 "Columbus Park of Roses": "Uno de los jardines municipales de rosas más grandes del país — más de 12,000 rosas dentro de Whetstone Park, en su mejor momento en junio. Gratis, y material de paseo de cita de primer nivel.",
 "Flight Adventure Park": "Parque interior de trampolines y aventura en Buck Owens Blvd — unos 40,000 pies cuadrados de trampolines, pista ninja e inflables. La opción para quemar la energía de los niños.",
 "The Empty Space": "Teatro comunitario a base de donativos — obras, comedia y una galería de arte bajo un techo, en su casa de Woodmere Drive al sur de la ciudad. Los asientos no vendidos salen 'paga lo que puedas' a la hora de la función.",
 "Central Park at Mill Creek": "El único parque del centro — una franja verde a lo largo del canal de Mill Creek, junto al museo de arte, con un laguito, fuentes de chorros y el puente de Mill Creek. El paseo del centro.",
 "Reading Cinemas Valley Plaza": "El cine dentro del centro comercial Valley Plaza — combina la película con el área de comida y hazlo una corrida completa al mall.",
 "Highbanks Metro Park": "El grande — 1,200 acres de bosque sobre el río Olentangy, con acantilados altos, senderos por cañadas y un centro de naturaleza. Este pin es el centro de naturaleza; el parque tiene varias entradas y todas valen la pena.",
 "AMC Dine-In Easton 30": "El AMC de 30 salas dentro de Easton Town Center — reclinables con cena, la jugada de cine por defecto en Easton.",
 "Fellows Riverside Gardens": "La joya de la corona de Mill Creek — 12 acres de jardines de rosas, glorietas y vistas al lago en el extremo norte del parque, con el Davis Center adentro. Gratis, y el lugar más fotografiado de Youngstown.",
 "Lanterman's Mill": "Un molino de 1845 que todavía muele en la cañada de Mill Creek — recorre el molino y luego mira el puente cubierto y la cascada afuera. La foto de postal del parque.",
 "Mill Creek Suspension Bridge": "El puente Cinderella — un puente colgante de 1895 en arco sobre la cañada de Mill Creek. Caminata corta, recompensa enorme, sobre todo en otoño.",
 "Lake Glacier": "El lago tranquilo de Mill Creek, en el norte — kayaks y botes de pedales en temporada, caminata fácil por la orilla todo el año.",
 "Ford Nature Center": "La sede de naturaleza de Mill Creek — exhibiciones de vida silvestre, una ventana para observar aves y salidas de senderos a la cañada. El mejor punto de partida del parque con niños.",
 "Wick Recreation Area": "El lado de juego de Mill Creek — campos deportivos, tenis, un campo de golf par-3, juegos y la colina para trineos en invierno.",
 "Mill Creek Golf Course": "Dos campos de 18 hoyos diseñados por Donald Ross (Norte y Sur) en Boardman — una ganga de golf público bien calificado, escondida al sur de Mill Creek.",
 "Butler Institute of American Art": "El primer museo de América construido solo para arte americano — y es gratis. Norman Rockwell, Winslow Homer y los famosos cuadros 'instantáneos' de Lincoln, junto a YSU.",
 "McDonough Museum of Art": "El museo de arte contemporáneo de YSU, frente al Butler — exhibiciones modernas rotativas en un edificio llamativo. También gratis.",
 "Covelli Centre": "La arena del centro — hockey de los Youngstown Phantoms, conciertos y shows grandes de gira. Depende de eventos; checa el calendario.",
 "DeYor Performing Arts Center": "Casa de la Sinfónica de Youngstown en el hermoso Powers Auditorium de 1931 — conciertos, giras de Broadway y danza en el centro.",
 "Stambaugh Auditorium": "Un auditorio Greek Revival de 1926 en el lado norte — conciertos, comedia y el gran salón de baile. Un ícono de Youngstown por dentro y por fuera.",
 "Youngstown Historical Center of Industry and Labor": "El Museo del Acero — la historia de las fábricas que construyeron el Valley, contada donde pasó. Serio y excelente.",
 "Arms Family Museum": "Una mansión-museo Arts & Crafts de 1905 en Millionaires Row — cuartos de época, historia local y las queridas exhibiciones navideñas en temporada.",
 "OH WOW! Children's Center": "Centro interactivo de ciencia y tecnología para niños en el centro — zonas para construir, chapotear y experimentar. Energía familiar pura.",
 "Wean Park": "El jardín delantero del centro — espacio verde junto al río y pasto de anfiteatro junto al Covelli Centre, sede de conciertos y festivales de verano.",
 "Boardman Park": "El 'Oasis Verde' de Boardman, de 227 acres — senderos, pabellones, parque para perros y la histórica St. James Meeting House. La sala de estar del municipio.",
 "Cinemark Tinseltown Boardman": "El cine grande de Boardman — asientos tipo estadio sobre la franja de la 224, la corrida de cine suburbana por defecto.",
 "Southern Park Mall": "El centro comercial techado de Boardman — tiendas, área de comida y el ancla del corredor de la 224.",
 "Camelot Lanes": "El boliche de Boardman — líneas, ligas y noches de boliche cósmico en el lado oeste.",
 "Wedgewood Lanes": "Boliche en Austintown — casa del famoso nombre de pizza Wedgewood. Líneas, más bar y cocina completos.",
 "Hollywood Gaming Mahoning Valley": "El racino — carreras de purasangres más un piso completo de casino (tragamonedas, mesas, póker) en el lado oeste. 21+ para el área de juego.",
 "Austintown Township Park": "El parque comunitario grande de Austintown — campos, canchas, juegos y pabellones, por Kirk Road.",
 "Canfield Fairgrounds": "Casa de la Feria de Canfield, una de las ferias de condado más grandes de Ohio (semana del Labor Day) — más eventos y shows todo el año en los terrenos.",
 "MetroParks Farm": "El campus granja de Mill Creek en Canfield — graneros de animales, un molino de viento, lago para pescar y programas de granja. Buenísimo con niños pequeños.",
 "White House Fruit Farm": "El famoso mercado de granja al sur de Canfield — donas por las que la gente maneja condados enteros, una nave de mercado gigante y terrenos junto al lago para pasear.",
 "National McKinley Birthplace Memorial": "Un templo griego de mármol en medio de Niles — museo y biblioteca en honor al presidente William McKinley, nacido a unas cuadras.",
 "Eastwood Mall": "Uno de los complejos comerciales más grandes de Ohio — el mall más todo un universo de tiendas grandes y restaurantes alrededor, en Niles.",
 "Eastwood Field": "Casa de los Mahoning Valley Scrappers (béisbol colegial de verano) — asientos baratos, noches de fuegos artificiales, verano clásico de estadio pequeño.",
 "National Packard Museum": "Warren construyó Packards antes que Detroit — este museo junta los carros, la historia y una rotación de clásicos. Obligado para la gente de carros.",
 "Packard Music Hall": "El gran salón de Warren desde 1955 — conciertos, comedia y shows de gira, financiado en su día por el propio Packard.",
 "Warren Community Amphitheatre": "Anfiteatro junto al río en el centro de Warren — serie de conciertos de verano y noches de River Rock at the Amp a orillas del río Mahoning.",
 "Mosquito Lake State Park": "Uno de los lagos más grandes de Ohio, justo al norte de Warren — playa, botes, pesca y camping. El día de lago de verano de la zona.",
 "Nelson Ledges Quarry Park": "La legendaria cantera — clavados desde acantilados y nado en agua de manantial cristalina, camping y fines de semana de festival en el bosque. Todo un mundo aparte; checa los fines de semana de eventos antes de una visita tranquila.",
 "Nelson-Kennedy Ledges State Park": "El parque estatal junto a la cantera — formaciones rocosas con musgo, pasajes estrechos entre piedras y senderos con cascadas. La mitad senderista de Nelson Ledges.",
 "The Lily Pond": "El cuerpo de agua artificial más antiguo del parque, escondido por McCollum Road junto a Birch Hill Drive — un sendero circular plano de un cuarto de milla lo rodea, con miradores de madera sobre el estanque y patos y gansos por todos lados (mira, no alimentes — reglas del parque). La cabaña Birch Hill está justo cruzando la calle.",
 "West Side Bowl": "El querido boliche del lado oeste, en Mahoning Ave — líneas, un escenario para bandas locales en vivo y una cocina de la que la gente habla maravillas. Mitad boliche, mitad foro de música, puro Youngstown.",
 "Youngstown Playhouse": "Teatro comunitario desde 1924 — uno de los más antiguos del país — con temporadas completas de obras y musicales en Glenwood Ave.",
 "Tyler History Center": "La casa céntrica de la Sociedad Histórica del Valle de Mahoning — exhibiciones rotativas de historia del Valley en un edificio histórico, antiguo local de Goodwill.",
 "Youngstown Main Library": "La gran biblioteca principal en Wick Ave — un edificio histórico con eventos, exhibiciones y una colección profunda de historia local y genealogía.",
 "Penguin City Brewing": "Cervecería y salón de eventos del centro, en East Federal — cervezas de la casa, food trucks, música en vivo y mercados. El corazón que late del regreso del centro.",
 "Wick Park": "Parque histórico del lado norte, junto a YSU — árboles grandes con sombra, un pabellón restaurado, senderos y disc golf. No confundir con el área recreativa Wick dentro de Mill Creek.",
 "Lake Newport": "El lago sur de Mill Creek — el salvaje: humedales, un paseo de madera, observación de aves y rampas para botes. Otro mundo comparado con el norte bien cuidado del parque.",
 "Bears Den": "Un montón de rocas gigantes de arenisca y pasajes estrechos entre piedras, escondido en medio de Mill Creek — una aventurita escondida junto a los senderos de la cañada.",
 "Poland Municipal Forest": "El bosque querido de Poland — pinos altos, senderos fáciles para caminar y un puente cubierto sobre Yellow Creek. El respiro tranquilo y con sombra.",

/* ---- Filtering + plan building ---- */
const DEFAULT_FILTERS = {who:"any", vibe:"any", budget:999, time:999, setting:"any", preferIndoor:false};
function placeOK(p,f){
  if(f.who!=="any" && !p.who.includes(f.who)) return false;
  if(f.vibe!=="any" && !p.vibes.includes(f.vibe)) return false;
  if(p.cost>f.budget) return false;
  if(f.setting==="in" && p.io==="out") return false;
  if(f.setting==="out" && p.io==="in") return false;
  if(f.preferIndoor && f.setting==="any" && p.io==="out" && p.cat!=="zoo") return false;
  return true;
}
function buildPlan(places,f,lockedMain){
  f=Object.assign({},DEFAULT_FILTERS,f||{});
  const pool=places.filter(p=>placeOK(p,f));
  if(!pool.length) return null;
  let main = lockedMain && placeOK(lockedMain,f) ? lockedMain : null;
  if(!main){
    let mains=pool.filter(p=>MAIN_CATS.includes(p.cat));
    if(!mains.length) mains=pool;
    if(f.time<999){ const timed=mains.filter(p=>p.dur<=f.time); if(timed.length) mains=timed; else { const quick=pool.filter(p=>p.dur<=f.time); if(quick.length) mains=quick; } }
    if(!mains.length) return null;
    main=pick(mains);
  }
  const rest=pool.filter(p=>p!==main);
  const near=(p)=> main.lat!=null&&p.lat!=null ? haversineMi(main.lat,main.lon,p.lat,p.lon) : (p.dist||0);
  let sides=rest.filter(p=>p.cat!==main.cat && p.dur<=90 && near(p)<=6);
  if(!sides.length) sides=rest.filter(p=>p.dur<=90).sort((a,b)=>near(a)-near(b)).slice(0,3);
  const side=sides.length?pick(sides):null;
  let closers=rest.filter(p=>p!==side && CLOSER_CATS.includes(p.cat) && near(p)<=6);
  if(!closers.length) closers=rest.filter(p=>p!==side && p.dur<=45).sort((a,b)=>near(a)-near(b)).slice(0,3);
  const closer=closers.length?pick(closers):null;
  const stops=[main,side,closer].filter(Boolean);
  const totalCost=stops.reduce((s,p)=>s+p.cost,0);
  const totalTime=stops.reduce((s,p)=>s+p.dur,0);
  if(totalTime>f.time && stops.length>1){
    // time crunch: drop the closer first, then side
    let s2=[main]; let t=main.dur;
    if(side && t+side.dur<=f.time){ s2.push(side); t+=side.dur; }
    else if(closer && t+closer.dur<=f.time){ s2.push(closer); t+=closer.dur; }
    return {stops:s2, main, totalCost:s2.reduce((s,p)=>s+p.cost,0), totalTime:t};
  }
  return {stops, main, totalCost, totalTime};
}
function planText(plan,zip){
  const L=WD_LANG==="es";
  const labels=L?["EVENTO PRINCIPAL","PARADA EXTRA","CIERRE"]:["MAIN EVENT","SIDE QUEST","CLOSER"];
  const lines=plan.stops.map((p,i)=>`${labels[i]||(L?"PARADA":"STOP")}: ${p.name} (${catLabel(p.cat)}${p.dist!=null?", "+p.dist+" mi":""}${p.cost? ", ~$"+p.cost+(L?"/persona":"/person"):(L?", Gratis":", Free")})`);
  return `What Do? \u2014 plan ${L?"para":"for"} ${zip}\n`+lines.join("\n")+`\nEst: ~$${plan.totalCost}${L?"/persona":"/person"} \u00B7 ~${Math.round(plan.totalTime/60*10)/10} hrs total`;
}

  return fetch(url,Object.assign({},opts,{signal:ctl.signal})).finally(()=>clearTimeout(t));
}
function getCache(zip){
  try{ const c=JSON.parse(localStorage.getItem(zipCacheKey)||"{}")[zip]; if(c && c.places && c.places.length && Date.now()-c.t<7*864e5) return c; }catch(e){}
  return null;
}
function setCache(zip,data){
  if(!data.places || !data.places.length) return; // never cache an empty result
  try{ const all=JSON.parse(localStorage.getItem(zipCacheKey)||"{}"); all[zip]=Object.assign({t:Date.now()},data); localStorage.setItem(zipCacheKey,JSON.stringify(all)); }catch(e){}
}
async function geocodeZip(zip){
  const r=await fetchT(`https://nominatim.openstreetmap.org/search?postalcode=${encodeURIComponent(zip)}&country=US&format=json&limit=1`,{},8000);
  const j=await r.json(); if(!j.length) throw new Error("ZIP not found");
  return {lat:parseFloat(j[0].lat), lon:parseFloat(j[0].lon), label:j[0].display_name.split(",").slice(0,2).join(",")};
}
function pickGeocodeResult(j,q){
  if(!j || !j.length) return null;
  const want=(q||"").split(",")[0].trim().toLowerCase();
  const firstSeg=(r)=>(r.display_name||"").split(",")[0].trim().toLowerCase();
  // A city that shares its name with its county (San Luis Obispo!) returns the COUNTY
  // boundary first — its centroid can be 15+ miles off. Prefer an exact name match.
  return j.find(r=>firstSeg(r)===want) || j.find(r=>!/county$/.test(firstSeg(r))) || j[0];
}
async function geocodeCity(q){
  const r=await fetchT(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&countrycodes=us&format=json&limit=5&addressdetails=1`,{},8000);
  const j=await r.json(); const hit=pickGeocodeResult(j,q); if(!hit) throw new Error("place not found");
  const a=hit.address||{};
  return {lat:parseFloat(hit.lat), lon:parseFloat(hit.lon), label:hit.display_name.split(",").slice(0,2).join(","), postcode:(a.postcode||"").slice(0,5)};
}
async function fetchPlaces(lat,lon){
  const q=`[out:json][timeout:15];(nwr["leisure"~"park|garden|miniature_golf|bowling_alley|ice_rink|sports_centre|nature_reserve|playground|beach_resort|common|dog_park"](around:10000,${lat},${lon});nwr["tourism"~"museum|gallery|zoo|aquarium|attraction|viewpoint|theme_park"](around:10000,${lat},${lon});nwr["amenity"~"cinema|theatre|arts_centre|library|marketplace|nightclub"](around:10000,${lat},${lon}););out center tags 300;`;
  const attempt=async(url)=>{
    const r=await fetchT(url,{method:"POST",body:"data="+encodeURIComponent(q),headers:{"Content-Type":"application/x-www-form-urlencoded"}},10000);
    if(!r.ok) throw new Error("overpass "+r.status);
    const j=await r.json();
    const places=placesFromElements(j.elements,lat,lon);
    if(!places.length) throw new Error("overpass empty");
    return places;
  };
  // Race all mirrors — first good answer wins; a hung mirror can't stall the roll.
  if(typeof Promise!=="undefined" && Promise.any){
    return Promise.any(OVERPASS_URLS.map(attempt));
  }
  let lastErr=null;
  for(const url of OVERPASS_URLS){ try{ return await attempt(url); }catch(e){ lastErr=e; } }
  throw lastErr||new Error("lookup failed");
}
async function fetchWeather(lat,lon){
  try{
    const r=await fetchT(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&temperature_unit=fahrenheit`,{},5000);
    const j=await r.json(); if(!j.current) return null;
    return {temp:Math.round(j.current.temperature_2m), code:j.current.weather_code};
  }catch(e){ return null; }
}

    if(picked){ g={lat:picked.lat, lon:picked.lon, label:picked.label, postcode:picked.postcode||null}; }
    else { try{ g=isZip?await geocodeZip(raw):await geocodeCity(raw); }catch(e){ g=null; } }
    let seedZip=isZip?raw:null;
    if(g && g.postcode) seedZip=g.postcode;
    if(!g){
      // Geocoder down? If this place has a starter pack, roll from the pack center instead of dying.
      const c=isZip?SEED_CENTERS[raw.slice(0,3)]:SEED_CITY_CENTERS[normCity(raw)];
      if(!c) throw new Error("geocode failed");
      g={lat:c[0], lon:c[1], label:raw};
    }
    state.label=g.label; state.center={lat:g.lat,lon:g.lon};
    let places=[];
    const wxPromise=fetchWeather(g.lat,g.lon);
    try{ places=await fetchPlaces(g.lat,g.lon); }catch(e){ places=[]; }
    // merge starters for this ZIP/city (dedupe by name), compute their distances
    for(const sp of seedForQuery(seedZip, isZip?null:raw)){

    $("#dWho").textContent=t("fWho"); $("#dVibe").textContent=t("fVibe"); $("#dBudget").textContent=t("fBudget"); $("#dTime").textContent=t("fTime"); $("#dSetting").textContent=t("fSetting");
    $("#drawerClose").textContent=t("done");
    $("#gSmall").textContent=t("hungry"); $("#gBold").textContent=t("grub");
    $("#menuBtn").setAttribute("aria-label", t("filters"));
    document.querySelectorAll("#langToggle span[data-l]").forEach(sp=>sp.classList.toggle("on", sp.dataset.l===WD_LANG));
    buildChips(); renderFilterSummary(); applyWeather();
    if(state.plan) renderPlan();
    if($("#mapWrap").style.display==="block") drawMap();
  }
  $("#langToggle").onclick=()=>{ WD_LANG=(WD_LANG==="es"?"en":"es"); try{ localStorage.setItem("whatdo_lang",WD_LANG); }catch(e){} applyLang(); };
  applyLang();

  /* ---- search autosuggest (Photon type-ahead + starter-pack cities) ---- */
  let sugTimer=null, sugSeq=0;
  function hideSuggest(){ $("#suggest").style.display="none"; }
  function renderSuggest(items){
    const box=$("#suggest");
    if(!items.length){ hideSuggest(); return; }
    box.innerHTML="";
    items.forEach(it=>{
      const d=document.createElement("div"); d.className="sugItem";
      const a=document.createElement("div"); a.className="sl"; a.textContent=it.label;
      const b=document.createElement("div"); b.className="ss"; b.textContent=it.sub;
      d.appendChild(a); d.appendChild(b);
      d.addEventListener("pointerdown",(e)=>{ e.preventDefault();
        $("#zip").value=it.label;
        if(it.picked) state.picked=Object.assign({}, it.picked, {key:it.label.toLowerCase()});
        hideSuggest();
      });
      box.appendChild(d);
    });
    box.style.display="block";
  }
  $("#zip").addEventListener("input", ()=>{
    const v=$("#zip").value;
    if(state.picked && v.trim().toLowerCase()!==state.picked.key) state.picked=null;
    const q=v.trim().toLowerCase();
    if(/^\d/.test(q)||q.length<3){ hideSuggest(); return; }
    const local=[];
    hideSuggest();
    clearTimeout(sugTimer); const seq=++sugSeq;
    sugTimer=setTimeout(async()=>{
      try{
        const r=await fetch("https://photon.komoot.io/api/?q="+encodeURIComponent(v.trim())+"&limit=6&lang=en");
        const j=await r.json(); if(seq!==sugSeq) return;
        const seen=new Set(local.map(x=>x.label.toLowerCase()));
        const items=(j.features||[]).filter(f=>f.properties&&f.properties.countrycode==="US").map(f=>{
          const pr=f.properties, cc=f.geometry.coordinates;
          const nm=pr.name||pr.city||""; if(!nm) return null;
          const label=nm+(pr.state?", "+pr.state:"");
          if(seen.has(label.toLowerCase())) return null; seen.add(label.toLowerCase());
          const sub=[(pr.city&&pr.city!==nm)?pr.city:null, pr.postcode||null].filter(Boolean).join(" \u00B7 ")||t("tapUse");
          return {label:label, sub:sub, picked:{lat:cc[1], lon:cc[0], label:label, postcode:pr.postcode||null}};
        }).filter(Boolean);
        renderSuggest(local.concat(items));
      }catch(e){}
    },280);
  });
  $("#zip").addEventListener("blur", ()=>setTimeout(hideSuggest,200));
  async function roll(){
    hideSuggest();
    const raw=$("#zip").value.trim();
    const isZip=/^\d{5}$/.test(raw);
    if(!isZip && raw.replace(/[^a-zA-Z ]/g,"").trim().length<2){ $("#zipNote").textContent=t("needInput"); return; }
    state.zip=raw; $("#rollBtn").disabled=true; $("#rollBtn").textContent=t("rolling");
    try{
      if(!state.places.length || state._zipLoaded!==raw.toLowerCase()){ await ensurePlaces(raw); state._zipLoaded=raw.toLowerCase(); }
      applyWeather();
      if(!state.places.length){ $("#zipNote").textContent=t("noSpots"); return; }
      $("#zipNote").textContent="";
      const plan=buildPlan(state.places,state.filters,state.lockedMain);
      if(!plan){ $("#zipNote").textContent=t("noPlan"); return; }
      state.plan=plan; renderPlan(); saveHistory();
    }catch(e){
      $("#zipNote").textContent=t("hiccup");
    }finally{ $("#rollBtn").disabled=false; $("#rollBtn").textContent=t("roll"); }
  }
  $("#rollBtn").onclick=roll;
  $("#againBtn").onclick=roll;
  $("#zip").addEventListener("keydown",(e)=>{ if(e.key==="Enter") roll(); });
  $("#lockBtn").onclick=()=>{ state.lockedMain=state.lockedMain?null:(state.plan?state.plan.main:null); renderPlan(); };
  $("#copyBtn").onclick=async()=>{
    if(!state.plan) return;
    const txt=planText(state.plan,state.zip);
    try{ await navigator.clipboard.writeText(txt); $("#copyBtn").textContent=t("copied"); setTimeout(()=>$("#copyBtn").textContent=t("copy"),1500); }
    catch(e){ $("#copyBtn").textContent=t("copyBlocked"); }
  };
  $("#locBtn").onclick=()=>{
    if(!navigator.geolocation){ $("#zipNote").textContent=t("locNA"); return; }
    $("#zipNote").textContent=t("gettingLoc");
    navigator.geolocation.getCurrentPosition(async(pos)=>{
      try{
        const {latitude:lat,longitude:lon}=pos.coords;
        const r=await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`);
        const j=await r.json(); const zip=(j.address&&j.address.postcode||"").slice(0,5);
        const cityName=(j.address&&(j.address.city||j.address.town||j.address.village))||"";
        if(zip){ $("#zip").value=zip; roll(); } else if(cityName){ $("#zip").value=cityName; roll(); } else $("#zipNote").textContent=t("locFailCity");
      }catch(e){ $("#zipNote").textContent=t("locFail"); }
    },()=>{ $("#zipNote").textContent=t("locDenied"); });
  };
}

/* Node/test export */
if(typeof module!=="undefined" && module.exports){ module.exports={CATS,CAT_BLURBS,CAT_BLURBS_ES,SEED_INFO,SEED_INFO_ES,setLang:(l)=>{WD_LANG=l;},getLang:()=>WD_LANG,catLabel,catFromTags,placesFromElements,seedForZip,seedForCity,seedForQuery,buildPlan,planText,placeOK,DEFAULT_FILTERS,haversineMi,fetchPlaces,geocodeZip,geocodeCity,pickGeocodeResult,SEED_CENTERS}; }
</script>
