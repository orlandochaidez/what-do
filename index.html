<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<title>What Do? — Things To Do Roulette</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#f7f5f0; --card:#ffffff; --ink:#1d1d22; --muted:#6d6d76;
  --accent:#0aa88a; --accent2:#7c4dff; --line:#e5e1d8; --chip:#eceae3;
  --shadow:0 10px 30px rgba(20,20,30,.10);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#222227; --card:#2e2e34; --ink:#f2f1ec; --muted:#a9a9b2; --line:#45454c; --chip:#3b3b43; --shadow:0 10px 30px rgba(0,0,0,.35); }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink);}
.wrap{max-width:560px; margin:0 auto; padding:18px 16px 40px; position:relative;}
@media(min-width:760px){ .wrap{padding-top:24px;} }

/* hamburger */
#menuBtn{position:fixed; top:14px; left:14px; z-index:60; width:46px; height:46px; border-radius:50%; border:1px solid var(--line); background:var(--card); box-shadow:var(--shadow); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;}
#menuBtn span{display:block; width:20px; height:2.5px; border-radius:2px; background:var(--ink);}
#menuBtn span:nth-child(2){width:14px; margin-right:6px; background:var(--accent);}

.logo{text-align:center; margin:26px 0 2px; font-size:44px; font-weight:900; letter-spacing:-1px;}
.logo .q{background:linear-gradient(120deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.tagline{text-align:center; color:var(--muted); margin:0 0 20px; font-size:15px;}

.zipRow{display:flex; gap:8px; justify-content:center; margin-bottom:10px;}
#zip{width:150px; padding:13px 14px; font-size:18px; text-align:center; border-radius:14px; border:1.5px solid var(--line); background:var(--card); color:var(--ink); outline:none;}
#zip:focus{border-color:var(--accent);}
#locBtn{padding:13px 14px; font-size:14px; border-radius:14px; border:1.5px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer;}
#zipNote{text-align:center; color:var(--muted); font-size:13px; min-height:18px; margin-bottom:8px;}
#wxPill{text-align:center; font-size:13px; color:var(--muted); margin-bottom:6px; min-height:16px;}

#rollBtn{display:block; width:100%; padding:19px; font-size:24px; font-weight:900; letter-spacing:.3px; color:#fff; border:none; border-radius:18px; cursor:pointer; background:linear-gradient(120deg,var(--accent),var(--accent2)); box-shadow:var(--shadow);}
#rollBtn:active{transform:scale(.985);}
#rollBtn:disabled{opacity:.55;}
#filterSummary{text-align:center; color:var(--muted); font-size:13px; margin:10px 4px 0; min-height:16px;}

/* result */
#result{margin-top:20px; display:none;}
.planCard{background:var(--card); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow); overflow:hidden;}
.planHead{padding:14px 18px; background:linear-gradient(120deg, rgba(10,168,138,.14), rgba(124,77,255,.14)); display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;}
.planHead .ttl{font-weight:800; font-size:16px;}
.pill{font-size:12px; padding:4px 9px; border-radius:999px; background:var(--chip); color:var(--ink); white-space:nowrap;}
.stop{padding:15px 18px; border-top:1px solid var(--line);}
.stop:first-of-type{border-top:none;}
.stopLabel{font-size:11px; font-weight:800; letter-spacing:1.2px; color:var(--accent); text-transform:uppercase; margin-bottom:3px;}
.stopLabel.side{color:var(--accent2);}
.stopLabel.closer{color:#e08a00;}
.stopName{font-size:20px; font-weight:800; line-height:1.2; overflow-wrap:anywhere;}
.stopMeta{color:var(--muted); font-size:13.5px; margin-top:3px; line-height:1.45; overflow-wrap:anywhere;}
.stopMeta a{color:var(--accent); text-decoration:none; font-weight:600;}
.stop{cursor:pointer;}
.tapHint{font-size:12px; color:var(--accent); font-weight:700; margin-top:5px;}
.detail{display:none; margin-top:10px; padding:11px 12px; background:var(--chip); border-radius:12px; font-size:14px; line-height:1.5;}
.detail.open{display:block;}
.detail .dInfo{margin-bottom:8px;}
.detail .dRow{color:var(--muted); font-size:13px; margin-bottom:3px;}
.detail .dLinks{margin-top:8px; display:flex; gap:12px; flex-wrap:wrap;}
.detail .dLinks a{color:var(--accent); font-weight:700; text-decoration:none; font-size:14px;}
.totals{display:flex; gap:8px; padding:14px 18px; border-top:1px solid var(--line); flex-wrap:wrap;}
.totalBox{flex:1; min-width:0; text-align:center; background:var(--chip); border-radius:12px; padding:9px 4px;}
.totalBox b{display:block; font-size:17px;}
.totalBox small{color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.6px;}
.btnRow{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
.btn{flex:1; min-width:120px; padding:14px 10px; font-size:16px; font-weight:700; border-radius:14px; border:1.5px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer;}
.btn.primary{background:linear-gradient(120deg,var(--accent),var(--accent2)); color:#fff; border:none;}
.btn.on{border-color:var(--accent2); color:var(--accent2);}

/* history */
#historyBox{margin-top:22px; display:none;}
#historyHead{cursor:pointer; font-weight:800; font-size:15px; padding:8px 2px; user-select:none;}
.histItem{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px; font-size:14px;}
.histItem small{color:var(--muted);}

/* drawer */
#scrim{position:fixed; inset:0; background:rgba(0,0,0,.38); z-index:70; opacity:0; pointer-events:none; transition:opacity .22s;}
#scrim.open{opacity:1; pointer-events:auto;}
#drawer{position:fixed; top:0; left:0; bottom:0; width:min(88vw,330px); background:var(--card); z-index:80; transform:translateX(-105%); transition:transform .24s; padding:20px 18px 30px; overflow-y:auto; box-shadow:6px 0 24px rgba(0,0,0,.2);}
#drawer.open{transform:translateX(0);}
#drawer h2{margin:2px 0 14px; font-size:20px;}
.fGroup{margin-bottom:16px;}
.fGroup h3{font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin:0 0 8px;}
.chips{display:flex; flex-wrap:wrap; gap:7px;}
.chip{padding:8px 12px; border-radius:999px; background:var(--chip); border:1.5px solid transparent; font-size:14px; cursor:pointer; color:var(--ink);}
.chip.sel{border-color:var(--accent); background:rgba(10,168,138,.14); font-weight:700;}
#drawerClose{width:100%; padding:13px; border:none; border-radius:12px; background:linear-gradient(120deg,var(--accent),var(--accent2)); color:#fff; font-weight:800; font-size:15px; cursor:pointer; margin-top:4px;}
.foot{text-align:center; color:var(--muted); font-size:12px; margin-top:28px; line-height:1.5;}

  #mapWrap{display:none;margin-top:12px;}
  #map{height:330px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--chip);}
  .pinNum{width:28px;height:28px;border-radius:50%;background:#0aa88a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);}
  .leaflet-container{font:inherit;}

  #suggest{display:none;text-align:left;max-width:520px;margin:0 auto 8px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);}
  .sugItem{padding:12px 14px;cursor:pointer;border-bottom:1px solid var(--line);}
  .sugItem:last-child{border-bottom:none;}
  .sugItem:active{background:var(--chip);}
  .sugItem .sl{font-weight:600;font-size:15px;}
  .sugItem .ss{color:var(--muted);font-size:12px;margin-top:1px;}

  #grubLink{position:fixed;left:12px;bottom:12px;z-index:60;display:flex;align-items:center;gap:8px;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:7px 13px 7px 9px;box-shadow:var(--shadow);text-decoration:none;}
  #grubLink svg{flex:none;color:var(--accent);}
  #grubLink .gT{display:flex;flex-direction:column;line-height:1.15;}
  #grubLink .gT small{color:var(--muted);font-size:10.5px;}
  #grubLink .gT b{font-size:13px;}

  .topRow{display:flex;justify-content:flex-end;margin-bottom:2px;}
  #langToggle{display:flex;align-items:center;gap:6px;background:var(--card);color:var(--muted);border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;}
  #langToggle span.on{color:var(--accent);font-weight:800;}
  #langToggle .lsep{opacity:.4;}
</style>
</head>
<body>
<button id="menuBtn" aria-label="Filters"><span></span><span></span><span></span></button>

<div class="wrap">
  <div class="topRow"><button id="langToggle" type="button" aria-label="Language / Idioma"><span data-l="en">EN</span><span class="lsep">|</span><span data-l="es">ES</span></button></div>
  <div class="logo">What Do<span class="q">?</span></div>
  <p class="tagline" id="tagline">What's there to do around here?</p>

  <div class="zipRow">
    <input id="zip" autocomplete="off" placeholder="ZIP or city name" maxlength="40">
    <button id="locBtn" type="button">Use my location</button>
  </div>
  <div id="suggest"></div>
  <div id="zipNote"></div>
  <div id="wxPill"></div>

  <button id="rollBtn" type="button">WHAT DO? 🎲</button>
  <div id="filterSummary"></div>

  <div id="result">
    <div class="planCard" id="planCard"></div>
    <div id="mapWrap"><div id="map"></div></div>
    <div class="btnRow">
      <button class="btn primary" id="againBtn" type="button">Roll Again 🎲</button>
      <button class="btn" id="lockBtn" type="button">Lock Main Event</button>
    </div>
    <div class="btnRow">
      <button class="btn" id="copyBtn" type="button">Copy Plan to Text</button>
      <button class="btn" id="mapBtn" type="button">View on Map 🗺</button>
    </div>
  </div>

  <div id="historyBox">
    <div id="historyHead"><span id="histLabel">History</span> <span id="histToggle">[+]</span></div>
    <div id="historyList" style="display:none;"></div>
  </div>

  <p class="foot" id="footNote">Places come from live OpenStreetMap data (plus a few hand-picked starters).<br>Costs &amp; times are estimates — check hours before you roll out.</p>
</div>

<a id="grubLink" href="https://orlandochaidez.com/grubroulette/" target="_blank" rel="noopener" aria-label="Hungry? Try GrubRoulette">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M3.5 10.5c0-4.2 3.8-6.8 8.5-6.8s8.5 2.6 8.5 6.8"/>
    <path d="M9.2 7h.01M12.8 6.4h.01M15.8 7.6h.01"/>
    <path d="M3 13.6c1.8-1.4 3.6 1.4 5.4 0 1.8-1.4 3.6 1.4 5.4 0 1.8-1.4 3.6 1.4 5.4 0"/>
    <path d="M4.6 17h14.8"/>
    <path d="M4 19.6c0 .9.7 1.6 1.6 1.6h12.8c.9 0 1.6-.7 1.6-1.6"/>
  </svg>
  <span class="gT"><small id="gSmall">Hungry?</small><b id="gBold">Try GrubRoulette</b></span>
</a>
<div id="scrim"></div>
<aside id="drawer" aria-label="Filters">
  <h2 id="dFilters">Filters</h2>
  <div class="fGroup"><h3 id="dWho">Who's going?</h3><div class="chips" id="fWho"></div></div>
  <div class="fGroup"><h3 id="dVibe">Vibe</h3><div class="chips" id="fVibe"></div></div>
  <div class="fGroup"><h3 id="dBudget">Budget (per person)</h3><div class="chips" id="fBudget"></div></div>
  <div class="fGroup"><h3 id="dTime">Time you got</h3><div class="chips" id="fTime"></div></div>
  <div class="fGroup"><h3 id="dSetting">Setting</h3><div class="chips" id="fSetting"></div></div>
  <button id="drawerClose" type="button">Done</button>
</aside>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";
/* ================= What Do? — core engine (pure, testable) ================= */
const $ = (s)=>document.querySelector(s);
let WD_LANG="en";
try{ WD_LANG = localStorage.getItem("whatdo_lang") || (((navigator.language||"en").toLowerCase().indexOf("es")===0)?"es":"en"); }catch(e){}
function catLabel(c){ const cm=CATS[c]; return (WD_LANG==="es"&&cm&&cm.labelEs)?cm.labelEs:(cm?cm.label:""); }

function haversineMi(aLat,aLon,bLat,bLon){
  const R=3958.8, dLa=(bLat-aLat)*Math.PI/180, dLo=(bLon-aLon)*Math.PI/180;
  const s=Math.sin(dLa/2)**2 + Math.cos(aLat*Math.PI/180)*Math.cos(bLat*Math.PI/180)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
const rnd = (n)=>Math.floor(Math.random()*n);
function pick(arr){ return arr[rnd(arr.length)]; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* Category model: dur = typical minutes, cost = est $/person, io = in/out/both */
const CATS = {
  park:      {label:"Park", labelEs:"Parque", icon:"🌳", dur:75,  cost:0,  io:"out", vibes:["chill","outdoors","active"], who:["solo","date","friends","family"]},
  garden:    {label:"Garden", labelEs:"Jardín", icon:"🌷", dur:60,  cost:5,  io:"out", vibes:["chill","outdoors","artsy"], who:["solo","date","family"]},
  viewpoint: {label:"Viewpoint", labelEs:"Mirador", icon:"🌇", dur:30,  cost:0,  io:"out", vibes:["chill","outdoors"], who:["solo","date","friends","family"]},
  museum:    {label:"Museum", labelEs:"Museo", icon:"🏛️", dur:120, cost:15, io:"in",  vibes:["artsy","chill","tourist"], who:["solo","date","friends","family"]},
  gallery:   {label:"Art Gallery", labelEs:"Galería de arte", icon:"🎨", dur:60,  cost:0,  io:"in",  vibes:["artsy","chill"], who:["solo","date","friends"]},
  zoo:       {label:"Zoo / Aquarium", labelEs:"Zoológico / Acuario", icon:"🦁", dur:150, cost:22, io:"both",vibes:["outdoors","tourist"], who:["date","friends","family"]},
  attraction:{label:"Attraction", labelEs:"Atracción", icon:"🎡", dur:120, cost:18, io:"both",vibes:["tourist","active"], who:["date","friends","family"]},
  cinema:    {label:"Movie Theater", labelEs:"Cine", icon:"🎬", dur:130, cost:14, io:"in",  vibes:["chill","nightlife"], who:["solo","date","friends","family"]},
  theatre:   {label:"Theatre", labelEs:"Teatro", icon:"🎭", dur:120, cost:25, io:"in",  vibes:["artsy","nightlife"], who:["date","friends"]},
  bowling:   {label:"Bowling", labelEs:"Boliche", icon:"🎳", dur:90,  cost:15, io:"in",  vibes:["active","nightlife"], who:["date","friends","family"]},
  minigolf:  {label:"Mini Golf", labelEs:"Minigolf", icon:"⛳", dur:60,  cost:12, io:"out", vibes:["active"], who:["date","friends","family"]},
  sports:    {label:"Sports / Rec", labelEs:"Deportes / Recreación", icon:"🏀", dur:90,  cost:10, io:"both",vibes:["active"], who:["solo","friends","family"]},
  ice:       {label:"Ice Rink", labelEs:"Pista de hielo", icon:"⛸️", dur:90,  cost:14, io:"in",  vibes:["active","winter"], who:["date","friends","family"]},
  snow:      {label:"Snow & Ski", labelEs:"Nieve y esquí", icon:"🎿", dur:240, cost:55, io:"out", vibes:["winter","active","outdoors"], who:["solo","date","friends","family"]},
  playground:{label:"Playground", labelEs:"Juegos infantiles", icon:"🛝", dur:60,  cost:0,  io:"out", vibes:["outdoors","active"], who:["family"]},
  library:   {label:"Library", labelEs:"Biblioteca", icon:"📚", dur:60,  cost:0,  io:"in",  vibes:["chill","artsy"], who:["solo","family"]},
  nature:    {label:"Nature / Trail", labelEs:"Naturaleza / Senderos", icon:"🥾", dur:120, cost:0,  io:"out", vibes:["outdoors","active","chill"], who:["solo","date","friends","family"]},
  beach:     {label:"Beach / Lake", labelEs:"Playa / Lago", icon:"🏖️", dur:150, cost:0,  io:"out", vibes:["outdoors","chill"], who:["date","friends","family"]},
  market:    {label:"Market", labelEs:"Mercado", icon:"🧺", dur:60,  cost:10, io:"both",vibes:["tourist","chill"], who:["solo","date","friends","family"]},
  cafe:      {label:"Café / Dessert", labelEs:"Café / Postres", icon:"🍦", dur:40,  cost:8,  io:"in",  vibes:["chill"], who:["solo","date","friends","family"]},
  nightlife: {label:"Nightlife", labelEs:"Vida nocturna", icon:"🎤", dur:120, cost:20, io:"in",  vibes:["nightlife","active"], who:["date","friends"]},
  generic:   {label:"Spot", labelEs:"Lugar", icon:"📍", dur:60,  cost:10, io:"both",vibes:["chill"], who:["solo","date","friends","family"]}
};
const CAT_BLURBS = {
  park:"A park — open green space, usually free. Good for a walk, a picnic, or just hanging out.",
  garden:"A garden or conservatory — plants, paths, and a slow pace.",
  viewpoint:"A viewpoint or overlook — go for the view, especially near sunset.",
  museum:"A museum — exhibits indoors, expect about the time shown. The dollar figure is a rough ticket estimate.",
  gallery:"An art gallery or arts center — usually free or cheap to browse.",
  zoo:"A zoo or aquarium — animals and exhibits; the dollar figure is a rough ticket estimate.",
  attraction:"A local attraction or landmark — the kind of place visitors get taken to. The dollar figure is a rough per-person estimate.",
  cinema:"A movie theater — check showtimes before you roll out.",
  theatre:"A theater or performance venue — check what's on; many only open for shows.",
  bowling:"A bowling alley — games plus shoe rental usually land near the estimate.",
  minigolf:"Mini golf — a round usually takes about an hour.",
  sports:"A sports or recreation center — courts, fields, or drop-in activities.",
  ice:"An ice rink — public skate sessions usually land near the estimate, skates included.",
  snow:"A ski or snow-play spot — lift tickets, rentals, and tubing usually land near the estimate. Always check snow conditions and road controls before you drive up.",
  playground:"A playground — a let-the-kids-burn-energy stop.",
  library:"A public library — quiet, free, and often hosting events.",
  nature:"Nature — trails, reserves, or wild coast. Bring water and check the weather.",
  beach:"A beach — sand, water, and however long you feel like staying.",
  market:"A market — stalls, food, and local stuff to browse.",
  cafe:"A cafe or dessert spot — the classic low-stakes closer.",
  nightlife:"Nightlife — music, karaoke, or a late scene. Best with the 21+ crew.",
  generic:"A local spot pulled from the map — tap 'Look it up' to see photos, reviews, and hours."
};
const CAT_BLURBS_ES = {
 "park": "Un parque — espacio verde abierto, casi siempre gratis. Bueno para caminar, un picnic o nomás pasar el rato.",
 "garden": "Un jardín o invernadero — plantas, senderos y ritmo tranquilo.",
 "viewpoint": "Un mirador — ve por la vista, sobre todo cerca del atardecer.",
 "museum": "Un museo — exhibiciones bajo techo, calcula el tiempo que se muestra. El costo es un estimado aproximado del boleto.",
 "gallery": "Una galería de arte o centro cultural — casi siempre gratis o barato para entrar a ver.",
 "zoo": "Un zoológico o acuario — animales y exhibiciones; el costo es un estimado aproximado del boleto.",
 "attraction": "Una atracción o lugar emblemático local — de esos a los que llevan a las visitas. El costo es un estimado aproximado por persona.",
 "cinema": "Un cine — checa los horarios antes de salir.",
 "theatre": "Un teatro o foro de espectáculos — checa la cartelera; muchos solo abren cuando hay función.",
 "bowling": "Un boliche — los juegos y la renta de zapatos suelen quedar cerca del estimado.",
 "minigolf": "Minigolf — una ronda suele tardar como una hora.",
 "sports": "Un centro deportivo o recreativo — canchas, campos o actividades sin reservar.",
 "ice": "Una pista de hielo — la sesión pública suele quedar cerca del estimado, patines incluidos.",
 "snow": "Un lugar de esquí o juegos en la nieve — boletos de lift, rentas y tubing suelen quedar cerca del estimado. Siempre checa las condiciones de nieve y los controles de carretera antes de manejar.",
 "playground": "Un área de juegos — la parada para que los niños quemen energía.",
 "library": "Una biblioteca pública — tranquila, gratis, y seguido con eventos.",
 "nature": "Naturaleza — senderos, reservas o costa. Lleva agua y checa el clima.",
 "beach": "Una playa o lago — arena, agua, y el tiempo que quieras quedarte.",
 "market": "Un mercado — puestos, comida y cosas locales para curiosear.",
 "cafe": "Un café o lugar de postres — el cierre clásico sin complicaciones.",
 "nightlife": "Vida nocturna — música, karaoke o ambiente tarde. Mejor con el grupo de 21+.",
 "generic": "Un lugar sacado del mapa — toca 'Buscar' para ver fotos, reseñas y horarios."
};
const CLOSER_CATS = ["viewpoint","cafe","garden","park","gallery","market"];
const MAIN_CATS   = ["zoo","attraction","museum","park","nature","cinema","bowling","sports","beach","theatre","minigolf","ice","nightlife","snow"];

function catFromTags(t){
  const L=t.leisure||"", T=t.tourism||"", A=t.amenity||"", N=t.natural||"";
  if(L==="park"||L==="common"||L==="dog_park") return "park";
  if(L==="garden"||T==="garden") return "garden";
  if(T==="viewpoint") return "viewpoint";
  if(T==="museum") return "museum";
  if(T==="gallery"||A==="arts_centre") return "gallery";
  if(T==="zoo"||T==="aquarium") return "zoo";
  if(T==="attraction"||T==="theme_park") return "attraction";
  if(A==="cinema") return "cinema";
  if(A==="theatre") return "theatre";

function addrFromTags(t){
  const parts=[t["addr:housenumber"],t["addr:street"]].filter(Boolean).join(" ");
  return parts || t["addr:street"] || "";
}

function placesFromElements(elements, cLat, cLon){
  const out=[], seen=new Set();
  for(const el of (elements||[])){
    const t=el.tags||{}; if(!t.name) continue;
    const lat=el.lat!=null?el.lat:(el.center&&el.center.lat), lon=el.lon!=null?el.lon:(el.center&&el.center.lon);
    if(lat==null||lon==null) continue;
    const key=t.name.toLowerCase()+"@"+lat.toFixed(3)+","+lon.toFixed(3);
    if(seen.has(key)) continue; seen.add(key);
    const cat=catFromTags(t), cm=CATS[cat]||CATS.generic;
    const dist=haversineMi(cLat,cLon,lat,lon);
    if(dist>15) continue;
    out.push({name:t.name, cat, lat, lon, dist:Math.round(dist*10)/10, addr:addrFromTags(t),
      dur:cm.dur, cost:cm.cost, io:cm.io, vibes:cm.vibes.slice(), who:cm.who.slice(), src:"live",
      website:t.website||t["contact:website"]||"", hours:t.opening_hours||"", info:""});
  }
  return out.sort((a,b)=>a.dist-b.dist);
}

 "Balch Park": "Mountain county park above Springville — a sequoia grove, two fishing ponds, and cool air at 4,700 feet when the valley is baking.",
 "Lake Isabella": "Kern's big mountain lake — swim beaches, boating, windsurfing, and fishing about an hour up the canyon. Scout Island and the marinas are the main bases.",
 "Colonel Allensworth State Historic Park": "The only town in California founded by African Americans (1908), now a state park of restored buildings — schoolhouse, church, and homes. About 45 minutes southwest.",
 "Fresno Chaffee Zoo": "One of the best mid-size zoos in the country — African Safari savanna, sea lion cove, and a rainforest. About 1 hour 15 from Porterville, and worth the drive.",
 "Forestiere Underground Gardens": "A Sicilian immigrant hand-dug this underground villa over 40 years — rooms, courtyards, and fruit trees below the Fresno hardpan. Guided tours; genuinely one of a kind.",
 "Shinzen Japanese Garden": "Five acres of Japanese garden inside Woodward Park — koi ponds, a teahouse, and the Clark Bonsai Collection. Peak calm, about 1 hour 15 away.",
 "Coffee Camp": "The locals' river spot — Upper and Lower Coffee Camp day-use areas on the Middle Fork of the Tule River, 9 miles east of Springville on Highway 190. Swim holes, fishing, and picnic tables under the oaks. Despite the name it's day use only (no camping), $12 per vehicle — and the Forest Service isn't kidding: the river is cold, fast, and the rocks are slippery.",
 "Camp Nelson": "Tiny mountain village on the Tule River at 4,800 feet — a meadow, a general store, river access, and the last stop before the high country. Cooler air the second you get out of the car.",
 "Mountain Home State Forest": "A state forest of giant sequoias right next to Balch Park — groves, fishing ponds, and campgrounds most tourists never find. Check current conditions before you go; parts are still recovering from the 2020 Castle Fire.",
 "Dome Rock": "A smooth granite dome near Ponderosa with a short scramble to the top — huge views over the Kern River country. Rock climbers love the face; sunset is the move.",
 "Quaking Aspen": "High-country meadow and campground at about 7,000 feet up Highway 190 past Camp Nelson — aspens, a creek, and trailheads into the Golden Trout Wilderness. A full escape from valley heat.",
 "Valley Strong Ballpark": "Home of the Visalia Rawhide (Single-A) downtown — cheap seats, fireworks nights, and classic small-ballpark summer. Check the schedule; it's game days only.",
 "Tulare County Museum": "The county museum inside Mooney Grove Park — pioneer cabins, old farm gear, and a huge collection of Native American baskets. Two stops in one trip.",
 "Slick Rock Recreation Area": "Kaweah River swimming and picnic area by Lake Kaweah, on the way to Sequoia — smooth granite slabs, cold clear water. Respect the current; it runs fast in spring.",
 "Hanford Fox Theatre": "Hanford's restored 1929 Fox Theatre on Douty Street — concerts, movies, and events in a gorgeous old palace. About 40 minutes from Porterville.",
 "Woodward Park": "Fresno's big northeast park — 300 acres on the San Joaquin River bluffs: trails, a BMX course, a dog park, and the Shinzen Garden inside it. About 1 hour 15 from Porterville.",
 "Storyland": "Storybook park in Roeding Park, right by the zoo — walk through Humpty Dumpty, the Three Little Pigs, and other nursery-rhyme scenes. Peak little-kid energy; pairs with the zoo next door.",
 "Roeding Park": "Fresno's classic central park — 90 acres of lawns, lakes, and big trees, home to the Chaffee Zoo and Storyland. The park itself is the picnic-and-stroll base camp.",
 "Fresno Art Museum": "The valley's art museum — modern and contemporary exhibits, folk art, and a sculpture garden. A quiet hour or two.",
 "Fresno Discovery Center": "Hands-on science center in southeast Fresno — interactive exhibits, a cactus garden, and turtles everywhere. Built for curious kids.",
 "Kearney Park": "Big county park west of Fresno around the Kearney Mansion — picnic grounds, sports fields, and tours of the French-colonial mansion. Civil War reenactment days are a whole scene.",
 "Meux Home Museum": "An 1889 Victorian house museum downtown — the Meux family home kept just as it was, gas lamps and all. Small, strange, charming tours.",
 "Chukchansi Park": "Downtown Fresno's ballpark — home of the Fresno Grizzlies, with concerts and events in the off season. Check the schedule before you roll.",
 "Island Waterpark": "Fresno's water park on Shaw Ave — slides, a wave pool, and a lazy river. Summer only; the valley-heat escape hatch.",
 "Blackbeard's Family Entertainment": "Pirate-themed family fun in Fresno — two mini golf courses, bumper boats, batting cages, and go-karts, going forever.",
 "Oso de Oro Park": "Fresno's famous fully-accessible playground — built so kids of all abilities can play, with shade and a pond next door. A feel-good family stop.",
 "Clovis Botanical Garden": "A free water-wise garden in Clovis — five acres showing what actually grows in valley heat. A short, pretty, educational stroll.",
 "Millerton Lake": "San Joaquin River reservoir at Friant, about 25 minutes past Fresno — boating, swimming beaches, and bald eagles in winter. A lake day at the edge of the foothills.",
 "Wild Water Adventure Park": "Clovis water park — 52 acres of slides, wave pools, and cabanas. Summer only. The other valley-heat escape hatch.",
 "Tower Theatre": "The 1939 art-deco landmark of the Tower District — concerts, comedy, and films, with the district's bars and cafes all around it.",
 "San Luis Obispo Botanical Garden": "Five acres of Mediterranean-climate gardens inside El Chorro Park — plants from all five Mediterranean regions of the world, free to wander.",
 "Terrace Hill": "The little open-space hill in the middle of SLO neighborhoods — a short climb to a full 360 of the city and the Nine Sisters. Local sunset secret.",
 "Sinsheimer Park": "SLO's sports park by the stadium — disc golf course, playgrounds, and ball fields along the creek.",
 "Architecture Graveyard": "Cal Poly's Poly Canyon design village — decades of experimental student-built structures scattered up a canyon trail. Weird, free, and photogenic.",
 "Palm Theatre": "SLO's indie/art-house cinema downtown since 1988 — the solar-powered, couch-seat, film-nerd pick.",
 "Fremont Theater": "The big neon 1938 movie palace on Monterey Street — first-run movies plus concerts and events under the marquee.",
 "Charles Paddock Zoo": "The Central Coast's zoo in Atascadero — red pandas, tigers, and meerkats in a compact, shady park setting. Easy half-day with kids.",
 "Atascadero Lake Park": "Park on Atascadero Lake right by the zoo — playground, picnic lawns, and paddle-boat energy. Pair it with the zoo next door.",
 "Sensorio Paso Robles": "A hillside of tens of thousands of glowing fiber-optic lights you walk through at dusk — the Field of Light. Ticketed evenings, about 35 minutes from SLO, and it books out.",
 "Ravine Waterpark": "Paso Robles' water park — slides, wave pool, and a lazy river for when the north county is cooking. Summer only.",
 "Morro Rock": "The 576-foot volcanic plug standing guard over Morro Bay harbor — walk the beach at its base, watch otters and peregrine falcons. The Central Coast's most famous silhouette.",
 "Morro Bay State Park": "Bay-side state park — heron rookery, salt marsh boardwalk, and kayak launches on calm estuary water. Birdwatching HQ.",
 "Montaña de Oro State Park": "'Mountain of Gold' — rugged bluffs, hidden coves, and the Bluff Trail, an easy cliff-top walk with nonstop ocean. The wild coast pick, 25 minutes from SLO.",
 "Los Osos Oaks State Reserve": "An ancient grove of coast live oaks, some 800 years old, draped in moss on easy sandy trails. Quiet and a little enchanted.",
 "Elfin Forest": "A boardwalk loop through a pygmy oak forest on the bay — 200-year-old oaks stunted to shrub height by the salt wind, with estuary views.",
 "Cayucos Pier": "The wooden pier of the last old-school California beach town — surf, sand, and the whole slow Cayucos strip behind you.",
 "Moonstone Beach": "Cambria's boardwalk beach — a mile of cliff-top path, tide pools, and polished moonstones in the sand at low tide. Peak sunset stroll.",
 "Fiscalini Ranch Preserve": "450 acres of bluff-top meadow and Monterey pine forest saved by the town of Cambria — the Bluff Trail is the sunset walk.",
 "Hearst Castle": "Hearst's hilltop palace — 165 rooms, Neptune Pool, and zebra leftovers on the ranch below. Tour tickets book ahead; it's about 50 minutes up the coast from SLO and a whole event.",
 "Elephant Seal Vista Point": "Thousands of elephant seals hauled out on the beach below the boardwalk, just north of Hearst Castle — loud, huge, and free. Peak season is winter.",
 "Village of Arroyo Grande & Swinging Bridge": "Old-town Arroyo Grande — the 1875 swinging bridge over the creek, roosters wandering the village, and antique shops on Branch Street.",
 "Lopez Lake": "The Five Cities' lake — boating, fishing, waterslides at Mustang Waterpark next door, and oak-shaded camping up Lopez Drive.",
 "Nipomo Regional Park": "Big oak-shaded county park in Nipomo — sports fields, playgrounds, and picnic space under the oaks.",
 "Dana Adobe": "The 1839 Dana Adobe — one of California's oldest adobe homes, on the old El Camino Real. Small museum, deep rancho history.",
 "The Luffa Farm": "A working farm growing luffa sponges (yes, they grow on vines) — quirky little tours and a gift shop in Nipomo. Peak random-roadside energy.",
 "Waller Park": "Santa Maria's big lake park — pedal boats, ducks, disc golf, and picnic lawns. The city's living room, about 35 minutes from SLO.",
 "Santa Maria Valley Discovery Museum": "Hands-on discovery museum downtown — building, climbing, and water-play zones for kids in the heart of Santa Maria.",
 "Guadalupe-Nipomo Dunes": "One of the largest coastal dune systems left in California — towering sand, rare plants, and the lost Cecil B. DeMille movie set buried somewhere out there.",
 "Kern River Parkway": "The 30-mile bike and walking path along the Kern River through the whole city — river views, herons, and the Lake Ming-to-Enos Lane run. Bakersfield's outdoor spine.",
 "Tule Elk State Natural Reserve": "A protected tule elk herd on the old valley floor west of town — viewing platform, big skies, and elk doing their thing about 30 minutes out. Bring binoculars.",
 "Wind Wolves Preserve": "The largest nonprofit nature preserve on the West Coast — 93,000 acres of grassland and mountains south of town, free trails, wildflowers in spring. About 45 minutes and a whole different world.",
 "Buena Vista Lake": "Buena Vista Aquatic Rec Area — Lake Webb for swimming, boating, and fishing about 30 minutes southwest. The county's summer lake day.",
 "Lake Woollomes": "Quiet little county lake park near Delano — fishing, picnic shelters, and zero crowd, about 40 minutes north.",
 "Murray Family Farms": "The Big Red Barn on Highway 58 — farm fun park with animals, slides, a jumping pillow, and you-pick fruit in season. Kid chaos, farm edition.",
 "The Marketplace": "The Ming Ave shopping strip — Regal movies, restaurants, and stores in one walkable center. The default southwest-side wander.",
 "Heritage Park": "East-side neighborhood park with sports fields, playgrounds, and picnic shade.",
 "Emerald Cove Park": "Clean newer park in the northwest — playground, wide lawns, and a pond loop.",
 "Tevis Park": "Southwest park with fields, courts, and playground space — the neighborhood all-purpose stop.",
 "Riverview Park": "Oildale's river-side park on Roberts Lane — big trees, fields, and Kern River Parkway trail access.",
 "Jefferson Park": "One of the city's oldest parks, on the east side — mature trees, a pool in summer, and picnic lawns.",
 "Buttonwillow Raceway Park": "The road-racing circuit west of town — track days, club racing, and spectating about 30 minutes out. Check the event calendar; it's loud in the best way.",
 "Auto Club Famoso Raceway": "The legendary Famoso drag strip — home of the March Meet and 70 years of nitro history. Event days only, about 30 minutes north, and your ears will know.",
 "Kern National Wildlife Refuge": "Vast restored wetlands northwest of town — an auto tour route through ponds packed with waterfowl in winter. The valley as it was 150 years ago. About 50 minutes.",
 "Stars Theatre Restaurant": "Dinner theatre downtown — dinner served at your table, then a full stage musical or comedy. The date-night classic.",
 "The Padre Hotel": "The 1928 Padre — Bakersfield's haunted-history landmark hotel, now the downtown nightlife anchor with bars and a rooftop scene. Go for the energy, stay for the ghost stories.",
 "Temblor Brewing Company": "Bakersfield's craft brewery on Buck Owens Blvd — big taproom, trivia and comedy nights, and food trucks. The local-beer hangout.",
 "Sandrini's Public House": -119.0199,
 "Tiki-Ko": -119.0178,
 "The Well Comedy Club": -119.0195,
 "Ethel's Old Corral Cafe": -118.9565,
 "Lengthwise Brewing Company": -119.0881,
 "Ohio Statehouse": "Ohio's capitol on Capitol Square — free guided tours of the Greek Revival statehouse and its museum, right downtown.",
 "Columbus Museum of Art": "The city's art museum — American and European collections, a hands-on creativity center, and free Sundays.",
 "COSI": "Center of Science and Industry — the huge hands-on science museum on the river: planetarium, high-wire unicycle, and entire themed streets. Ranked among the best science museums in the country.",
 "North Market": "Columbus's public market since 1876 — dozens of local food stalls, flowers, and spices under one roof downtown. Graze your way through it.",
 "Short North Arts District": "The arches strip on High Street — gallery row, boutiques, murals, and bars. Gallery Hop nights (first Saturdays) are the big scene.",
 "German Village": "The brick-street historic district south of downtown — 19th-century cottages, bookshops, bakeries, and the 32-room Book Loft maze. A wander, not a stop.",
 "Scioto Mile": "The downtown riverfront park — fountains, swings, and skyline views along the Scioto. The city's front porch.",
 "Topiary Park": "A living Seurat painting — topiary figures of 'A Sunday Afternoon' clipped into a downtown park. Small, free, and surreal.",
 "Huntington Park": "Home of the Columbus Clippers (Triple-A) in the Arena District — one of the nicest minor-league parks in America. Check the schedule; dime-a-dog nights are legendary.",
 "Ohio Stadium": "The Horseshoe — Ohio State's 102,000-seat cathedral on the Olentangy. Tours on non-game days; on game days the whole area is the event.",
 "National Veterans Memorial and Museum": "The national veterans museum on the river — personal stories told powerful and modern. Heavy in the good way.",
 "Goodale Park": "The city's oldest park, in Victorian Village — pond, gazebo, and ComFest energy in summer.",
 "Schiller Park": "German Village's park — flower gardens, a fishing pond, and free summer theatre under the trees.",
 "Antrim Park": "A lake loop on the Olentangy just south of Worthington — the run/walk/ride circuit plus fishing and ball fields. The northwest-side default.",
 "Hayden Falls Park": "A 35-foot waterfall in a gorge hidden off Hayden Run Road — short boardwalk, big payoff, especially after rain.",
 "Ohio Theatre": "The 1928 Spanish-baroque movie palace turned performing arts palace — Broadway tours, the Columbus Symphony, and CAPA summer movies.",
 "Bridge Park": "Dublin's new downtown across the pedestrian bridge from old Dublin — restaurants, bars, the market hall, and riverfront lawns.",
 "Indian Run Falls": "A waterfall gorge tucked behind a Dublin neighborhood — boardwalks over the falls, five minutes from Bridge Park.",
 "Ballantrae Park": "The park with the giant dancing hares — a 20-foot bronze sculpture of three hares on a hill, plus trails and a spray fountain.",
 "Muirfield Village Golf Club": "Jack Nicklaus's masterpiece and home of the Memorial Tournament — public play is limited, so check access and rates before you roll.",
 "Safari Golf Club": "The public course by the zoo where safari animals sometimes watch from next door — a solid, affordable round.",
 "Olentangy Indian Caverns": "Wyandotte-used caverns north of town — guided cave tours, a maze, gem mining, and minigolf on the grounds.",
 "Battelle Darby Creek Metro Park": "The bison park — a real herd roaming restored prairie west of Columbus, plus Big Darby Creek trails and a big nature center. About 40 minutes from Worthington.",
 "Hollywood Casino Columbus": "The west-side casino — slots, tables, poker room, and restaurants under one roof. The 21+ late-night option.",
 "Walnut Woods Metro Park": "A forest of 100-foot white pines planted in the 1930s-70s on the southeast side — quiet trails through a green cathedral.",
 "Dawes Arboretum": "1,900 acres of gardens, a Japanese garden, and a hedge that spells out 'Dawes Arboretum' readable from the air. About 45 minutes from Worthington.",
 "Newark Earthworks": "The largest ancient earthworks in the world — 2,000-year-old Hopewell geometry: a perfect circle and octagon aligned to the moon. UNESCO-level history, about 45 minutes out.",
 "Buckeye Lake State Park": "Ohio's oldest state park, on the big recreational lake east of town — swimming beach, boating, and lakeside bars. Summer day-trip mode, about 40 minutes.",
 "Old Man's Cave": "Hocking Hills' greatest hit — a towering recess cave in a hemlock gorge with waterfalls and stone bridges. About an hour from Worthington and worth every minute; weekends get packed.",
 "Ash Cave": "A 700-foot-wide horseshoe cave with a waterfall pouring over the rim — the biggest recess cave in Ohio, on an easy paved path in Hocking Hills.",
 "Cedar Falls": "The most water volume of any fall in Hocking Hills — a hemlock-shaded cascade between Old Man's Cave and Ash Cave. Not actually cedars; early settlers misnamed the hemlocks.",
 "Delaware State Park": "Delaware Lake's state park just north of town — a big swim beach, marina, and fishing on the reservoir.",
 "Blue Limestone Park": "A spring-fed old limestone quarry in town turned swimming and fishing hole — the water is that impossible blue-green.",
 "Gallant Woods Park": "Preservation Parks' old-growth forest preserve — big trees, a nature center, and quiet trails west of Delaware.",
 "Shale Hollow Park": "A little gorge gem — a stream cutting through shale cliffs with concretion stones, plus a natural play area. Preservation Parks' prettiest small park.",
 "Highlands Park Aquatic Center": "Westerville's outdoor water park — slides, a lazy river, and a big leisure pool. Summer only.",
 "Hanby House": "The Hanby family home — an Underground Railroad stop and the house of the composer of 'Up on the Housetop', written right here. Small house, deep history.",
 "Liberty Park": "Liberty Township's big park by Powell — splash pad, playgrounds, trails, and fields on Home Road.",
 "Emily Traphagen Preserve": "A quiet Preservation Parks preserve in Powell — meadow and woods trails for a low-key walk.",
 "Mt. Gilead State Park": "A small, peaceful state park between Columbus and Mansfield — two little lakes, fishing, and woods. About 45 minutes north.",
 "Warren G. Harding Home": "President Harding's home and his 1920 front-porch campaign HQ — restored house plus the Harding Presidential Center next door. About 50 minutes north.",
 "Wyandot Popcorn Museum": "The world's only popcorn museum — antique poppers under a circus tent inside Heritage Hall. Marion was a popcorn capital; this is peak Ohio quirky.",
 "Ariel-Foundation Park": "A 250-acre park built around a ruined glass factory — a Rastin observation tower, lakes, and industrial ruins as art. About 50 minutes northeast and genuinely unique.",
 "Mohican State Park": "Ohio's adventure country — the Clear Fork gorge, covered bridge, fire tower, and river livery land. About an hour northeast; the other big nature day trip.",
 "Malabar Farm State Park": "Louis Bromfield's working farm — the Big House where Bogart and Bacall got married, farm tours, and maple syrup in spring. About an hour northeast.",
 "Tod Park": "Girard's main park — ball fields, playgrounds, and the community pool scene in summer.",
 "Churchill Park": "Liberty Township's park at Churchill — fields, playground, and picnic space serving the Girard-Liberty side.",
 "Mauthe Park": "Struthers' park on the Yellow Creek side — playgrounds, fields, and the summer concert crowd.",
 "Roosevelt Park": "Campbell's neighborhood park — fields, courts, and picnic shade just east of Youngstown.",
 "Avalon at Squaw Creek": "The Avalon golf course at Squaw Creek — a classic Warren-area country club course that's open for public play options.",
 "Yankee Lake": "The little lake village in Brookfield — a pay-fishing lake and party spot that's been a local summer tradition forever.",
 "Howland Township Park": "Howland's township park — trails, fields, and a bandshell on the Warren side of the valley.",
 "Newton Falls Covered Bridge": "The 1831 covered bridge over the Mahoning River — Ohio's second-oldest, and the town's whole identity. Quick, photogenic stop about 30 minutes west.",
 "Lake Milton State Park": "A 1,700-acre lake west of Youngstown — swim beach, boating, and fishing, about 25 minutes out. The valley's lake day.",
 "Berlin Lake": "A big quiet reservoir southwest of Youngstown — fishing, boating, and shoreline camping, about 35 minutes out.",
 "Firestone Park": "Harvey Firestone's hometown park in Columbiana — a lake, an amphitheater, and one of Ohio's prettiest small-town parks, about 30 minutes south.",
 "West Branch State Park": "A big lake state park on the Michael J. Kirwan reservoir — beach, boating, and 20 miles of trails, about 40 minutes west.",
 "Tehachapi Loop": "The world-famous railroad spiral — trains loop over themselves climbing the Tehachapi Pass. Pull off at the overlook and wait for a freight; it's engineering theater. About an hour from Bakersfield.",
 "Tehachapi Depot Museum": "The rebuilt 1876 railroad depot in downtown Tehachapi — train history, a caboose, and front-row watching of the pass traffic.",
 "Circle Park": "Kernville's town park on the river — shade, the rodeo grounds energy, and the Kern River running right past it.",
 "Kern Valley Museum": "The Kern River Valley's museum — gold rush, movie-western, and river history in little Kernville. Free and full of local soul.",
 "Silver City Ghost Town": "A rescued ghost town by Lake Isabella — 1870s mining buildings moved here and kept as a walk-through museum. Spooky, dusty, great.",
 "Greenhorn Mountain Park": "County park in the pines above Lake Isabella — disc golf, picnic grounds, and cool mountain air when the valley is baking.",
 "Shirley Meadow / Alta Sierra Ski Area": "Kern's little local ski hill above Lake Isabella — a couple lifts, tubing, and summer lift rides. Winter conditions vary; check before you drive up.",
 "Red Rock Canyon State Park": "Desert cliffs and badlands in every shade of red on Highway 14 — movie-set scenery, short hikes, and huge night skies. About 1 hour 15 from Bakersfield.",
 "Mojave Air and Space Port": "The civilian spaceport — spaceship history (SpaceShipOne flew from here), a plane boneyard you can view, and flight-test weirdness. About an hour from Bakersfield; weekend plane-spotting is the move.",
 "Randsburg": "A living ghost town in the Rand Mountains — 1890s gold-rush main street with a working general store and soda fountain. About 1 hour 30; pair it with Red Rock Canyon.",
 "Twenty Mule Team Museum": "Borax history in Boron — the twenty-mule-team story that hauled borax out of Death Valley, next to the open-pit mine town.",
 "Borax Visitor Center": "The lookout over one of the world's biggest borax mines — museum, film, and a giant open pit with toy-looking haul trucks that are actually 200-tonners.",
 "Maturango Museum": "Ridgecrest's desert museum — Coso petroglyph country history, natural history, and desert art. The gateway stop if you're heading to the high desert.",
 "West Kern Oil Museum": "Oil country history in Taft — a full wooden derrick, boomtown photos, and the story of the Lakeview Gusher. Kern's black-gold roots.",
 "Minter Field Air Museum": "WWII aviation museum at the old Minter Field in Shafter — training-plane history, hangars, and fly-in days.",
 "Fort Tejon State Historic Park": "An 1854 army fort in the Grapevine canyon — restored barracks, dragoon history, and huge valley oaks. Civil War reenactment days are the big draw. About 45 minutes south.",
 "Outlets at Tejon": "The outlet mall at the base of the Grapevine on I-5 — the Tejon Ranch shopping stop everyone makes between Bakersfield and LA.",
 "Mount Pinos": "At 8,831 feet, the highest point around — an easy summit walk from the Nordic Base by Frazier Park, with stargazing that's famous statewide.",
 "Hungry Valley SVRA": "4,000 acres of off-road trails at Gorman — bring the OHV or just watch the hill climbs. Another world, 45 minutes south.",
 "Yosemite Valley": "The Valley — El Capitan, Half Dome, Yosemite Falls, and the Merced River in one mile-wide granite cathedral. About 1 hour 30 from Fresno (2+ from Porterville); summer entry reservations can apply, so check nps.gov before the big drive.",
 "Glacier Point": "The overlook 3,200 feet above Yosemite Valley — Half Dome in your face, the whole Sierra behind it. Glacier Point Road is seasonal (roughly late spring to late fall).",
 "Mariposa Grove of Giant Sequoias": "Yosemite's big-tree grove near the south entrance — 500+ giant sequoias including the Grizzly Giant and the California Tunnel Tree. Shuttle from the welcome plaza.",
 "Shaver Lake": "The Sierra lake at 5,400 feet — swimming, boating, and pines about an hour above Fresno. The classic valley escape hatch from summer heat.",
 "Bass Lake": "Warm-water Sierra lake near Oakhurst on the way to Yosemite — swim beaches, boat rentals, and lakeside resorts. You might recognize it from The Great Outdoors.",
 "Pine Flat Lake": "The Kings River reservoir in the foothills east of Fresno — boating, fishing, and swim areas about 45 minutes from Porterville.",
 "Hume Lake": "A serene little mountain lake between Kings Canyon and Sequoia — swim beach, canoes, and a flat 2.6-mile loop trail. Pairs with the Grant Grove day.",
 "Tunnel Log": "A fallen giant sequoia you drive through on the Crescent Meadow road — the most 1930s-road-trip photo in the park. Seasonal road; check it's open.",
 "San Luis National Wildlife Refuge": "Wetlands and grasslands west of Merced with an auto tour route — elk, waterfowl, and big valley skies. Best in winter when the birds pile in.",
 "Merced National Wildlife Refuge": "Famous for winter sandhill cranes and snow geese by the thousands at sunset — the fly-in is a whole show. Auto tour route, free.",
 "Pixley National Wildlife Refuge": "A small refuge between Porterville and Bakersfield where sandhill cranes winter on the old valley floor. Short trails, big birds, quiet.",
 "Pinnacles National Park": "California's otherworldly volcanic park — rock spires, talus caves, and California condors riding the thermals. East side via King City is the close entrance from the coast ranges; bring water, it cooks in summer.",
 "Carrizo Plain National Monument": "A vast empty grassland valley between SLO and Bakersfield — Soda Lake, the San Andreas Fault in plain sight, and spring wildflower superblooms that make national news. Dirt roads, no services, bring everything.",
 "Bixby Creek Bridge": "The most photographed bridge in California — a 1932 concrete arch 260 feet over a Big Sur canyon. About 2 hours up Highway 1 from SLO; pull over, take the shot.",
 "McWay Falls": "An 80-foot waterfall that pours straight onto a Big Sur cove beach — the postcard shot from the Julia Pfeiffer Burns overlook trail. Short walk, huge payoff.",
 "Pfeiffer Beach": "Big Sur's wild local beach — purple sand streaks, crashing surf (no swimming), and the famous Keyhole Rock sunset shot. Down a twisty unmarked road off Highway 1.",
 "Point Lobos State Natural Reserve": "Called the crown jewel of the state parks — sea lions, otters, cypress groves, and turquoise coves on easy trails by Carmel. Arrive early; parking fills.",
 "Asilomar State Beach": "A mile of dunes, tide pools, and boardwalk in Pacific Grove — sunset walks and surfers, next door to Monterey.",
 "Monterey Bay Aquarium": "The world-class aquarium on Cannery Row — kelp forest, sea otters, and the Open Sea gallery. Tickets book ahead on weekends; it's about 2 hours from SLO.",
 "Elkhorn Slough": "One of California's great estuaries — kayak among sea otters, seals, and hundreds of bird species at Moss Landing. Rentals and tours right at the harbor.",
 "Garrapata State Park": "Unmarked gates along Highway 1 south of Carmel open to bluffs, coves, and calla-lily canyons — Big Sur's quieter doorstep.",
 "Audubon Kern River Preserve": "Audubon's cottonwood-willow forest preserve on the South Fork Kern — one of the best birding spots in the state, with trails into the riparian jungle. About an hour from Bakersfield.",
 "China Peak Mountain Resort": "The Fresno-side ski resort at Huntington Lake, 7,000 feet up — the closest real skiing to the valley floor, about 1 hour 15 from Fresno. Check snow and chain controls in winter.",
 "Badger Pass Ski Area": "California's oldest ski area, inside Yosemite — small, mellow, family-first slopes on Glacier Point Road. The ski day with a national park wrapped around it.",
 "Curry Village Ice Rink": "Ice skating in Yosemite Valley with Half Dome right over the rink — a winter tradition since 1928. Seasonal, roughly late fall through early spring.",
 "Mountain High Resort": "The closest ski resort to LA — three mountains by Wrightwood, famous for night skiing under the lights. About 1 hour 30 from downtown when the roads are clear.",
 "Snow Summit": "Big Bear's original ski hill — family-friendly slopes and a scenic sky chair over the lake town. Winter = ski; book ahead on holiday weekends.",
 "Bear Mountain": "Snow Summit's sister across town — the park-rat mountain, with the most terrain parks in SoCal. Same lift ticket family as Summit.",
 "Mt Baldy Resort": "The closest snow to the city — Baldy's funky old-school lifts up San Antonio Canyon. Steep, scrappy, and beloved; check conditions, it needs real storms.",
 "Snow Valley Mountain Resort": "The first resort you hit driving up to Big Bear — smaller, mellower, with a big sledding and snow-play scene for kids.",

 "Packard Music Hall": "El gran salón de Warren desde 1955 — conciertos, comedia y shows de gira, financiado en su día por el propio Packard.",
 "Warren Community Amphitheatre": "Anfiteatro junto al río en el centro de Warren — serie de conciertos de verano y noches de River Rock at the Amp a orillas del río Mahoning.",
 "Mosquito Lake State Park": "Uno de los lagos más grandes de Ohio, justo al norte de Warren — playa, botes, pesca y camping. El día de lago de verano de la zona.",
 "Nelson Ledges Quarry Park": "La legendaria cantera — clavados desde acantilados y nado en agua de manantial cristalina, camping y fines de semana de festival en el bosque. Todo un mundo aparte; checa los fines de semana de eventos antes de una visita tranquila.",
 "Nelson-Kennedy Ledges State Park": "El parque estatal junto a la cantera — formaciones rocosas con musgo, pasajes estrechos entre piedras y senderos con cascadas. La mitad senderista de Nelson Ledges.",
 "The Lily Pond": "El cuerpo de agua artificial más antiguo del parque, escondido por McCollum Road junto a Birch Hill Drive — un sendero circular plano de un cuarto de milla lo rodea, con miradores de madera sobre el estanque y patos y gansos por todos lados (mira, no alimentes — reglas del parque). La cabaña Birch Hill está justo cruzando la calle.",
 "West Side Bowl": "El querido boliche del lado oeste, en Mahoning Ave — líneas, un escenario para bandas locales en vivo y una cocina de la que la gente habla maravillas. Mitad boliche, mitad foro de música, puro Youngstown.",
 "Youngstown Playhouse": "Teatro comunitario desde 1924 — uno de los más antiguos del país — con temporadas completas de obras y musicales en Glenwood Ave.",
 "Tyler History Center": "La casa céntrica de la Sociedad Histórica del Valle de Mahoning — exhibiciones rotativas de historia del Valley en un edificio histórico, antiguo local de Goodwill.",
 "Youngstown Main Library": "La gran biblioteca principal en Wick Ave — un edificio histórico con eventos, exhibiciones y una colección profunda de historia local y genealogía.",
 "Penguin City Brewing": "Cervecería y salón de eventos del centro, en East Federal — cervezas de la casa, food trucks, música en vivo y mercados. El corazón que late del regreso del centro.",
 "Wick Park": "Parque histórico del lado norte, junto a YSU — árboles grandes con sombra, un pabellón restaurado, senderos y disc golf. No confundir con el área recreativa Wick dentro de Mill Creek.",
 "Lake Newport": "El lago sur de Mill Creek — el salvaje: humedales, un paseo de madera, observación de aves y rampas para botes. Otro mundo comparado con el norte bien cuidado del parque.",
 "Bears Den": "Un montón de rocas gigantes de arenisca y pasajes estrechos entre piedras, escondido en medio de Mill Creek — una aventurita escondida junto a los senderos de la cañada.",
 "Poland Municipal Forest": "El bosque querido de Poland — pinos altos, senderos fáciles para caminar y un puente cubierto sobre Yellow Creek. El respiro tranquilo y con sombra.",
 "Yellow Creek Park": "Parque junto al arroyo en Struthers — senderos por Yellow Creek, áreas de picnic y el horno de piedra Hopewell, reliquia de la época del hierro de los 1800.",
 "Extreme Air Trampoline Park": "Parque de trampolines junto al complejo Eastwood — canchas de salto, fosas de espuma y obstáculos ninja. Deshecho máximo de energía infantil.",
 "Blacklick Woods Metro Park": "Parque metropolitano en Reynoldsburg famoso por su paseo entre las copas — una pasarela a 40 pies de altura entre los árboles (abierta en 2024) — más senderos por un bosque de hayas y arces y un centro de naturaleza.",
 "Rocky Fork Metro Park": "Parque metropolitano sobre el arroyo Rocky Fork, en el límite entre Westerville y New Albany — senderos boscosos, un parque para perros y pabellones de picnic entre los pinos.",
 "Rose Run Park": "El parque central de New Albany — el arroyo Rose Run, jardines y puentes que unen la biblioteca, el campus escolar y el anfiteatro Hinson. La puerta principal del pueblo.",
 "Friendship Park": "Parque de Gahanna junto al arroyo Big Walnut — terrenos de cuento con una glorieta, un lago para pescar y senderos junto al arroyo.",
 "Woodside Green Park": "Parque de barrio en Gahanna, sobre el sendero del Big Walnut — juegos, canchas deportivas y acceso al arroyo.",
 "Hoover Reservoir Park": "El parque junto a la presa Hoover, en Sunbury Road — 4,700 acres de agua y bosque: pesca, rampas para botes, observación de aves (aquí anidan águilas calvas), el campo de disc golf Brent Hambrick y atardeceres sobre el embalse.",
 "ZipZone Outdoor Adventures": "Tirolesas y un parque de aventura entre los árboles del bosque de Camp Mary Orton, por North High Street — tours guiados entre las copas y más de 60 retos para escalar. Se requiere reservación y es por temporada (cerrado en invierno).",
 "Alum Creek State Park": "Parque estatal enorme junto al lago Alum Creek, al norte de la ciudad — la playa para nadar es lo principal en verano, más botes, pesca y senderos. Ojo: es un parque grande y este pin es el centro del parque — sigue los letreros adentro hasta la playa, en la orilla suroeste.",
 "Zalud House Museum": "Una casa pionera de ladrillo de 1891 convertida en museo — una de las pocas casas estilo Second Empire que quedan en el Valle Central, amueblada de época.",
 "Success Lake": "El lago de casa, justo al este del pueblo sobre el río Tule — pesca, botes, camping y días de nado en verano. La corrida al lago por defecto de Porterville.",
 "Eagle Mountain Casino": "El casino de la tribu Tule River, aquí mismo en Porterville — tragamonedas, juegos de mesa y conciertos. 21+ para el área de juego.",
 "Galaxy Theatres Porterville": "El cine de Porterville — asientos tipo estadio y los estrenos sin manejar hasta Visalia.",
 "Mooney Grove Park": "El famoso parque de encinos de Visalia — encinos gigantes del valle, una laguna y la estatua End of the Trail. Territorio de picnic con sombra desde 1909.",
 "Visalia Fox Theatre": "Palacio de cine restaurado de 1930 en Main Street — conciertos, comedia y películas bajo la torre del reloj. La joya del centro de Visalia.",
 "Kaweah Oaks Preserve": "Un pedazo raro del antiguo bosque de encinos del valle, salvado junto al río Kaweah al este de Visalia — senderos planos y con sombra bajo encinos de 300 años.",
 "ImagineU Children's Museum": "Museo infantil interactivo en el centro — zonas para trepar, construir, chapotear y jugar a la granja, hechas para la energía de los menores de 10 años.",
 "Visalia Adventure Park": "Parque de diversión familiar sobre la carretera 198 — minigolf, go-karts, lanchitas de choque, jaulas de bateo y maquinitas. Paga por juego o compra un pase.",
 "Lake Kaweah": "Embalse en las faldas de la Sierra, sobre el río Kaweah — botes, pesca y nado, camino a Sequoia. A unos 45 minutos de Porterville.",
 "General Sherman Tree": "El árbol más grande del planeta por volumen, en el Giant Forest del Parque Nacional Sequoia — el sendero pavimentado de bajada es fácil; la escala, no. A 1.5-2 horas de Porterville; aplica la cuota de entrada al parque.",
 "Moro Rock": "Una cúpula de granito en el Parque Nacional Sequoia con 350 escalones tallados — desde arriba se ve toda la Great Western Divide. El mismo viaje que los árboles gigantes.",
 "General Grant Tree": "El árbol de Navidad de la nación — una secuoya gigante en Grant Grove, Parque Nacional Kings Canyon, en un circuito corto pavimentado junto a otros gigantes. A unas 2 horas de Porterville; aplica la cuota de entrada al parque.",
 "Trail of 100 Giants": "Un circuito pavimentado y fácil entre secuoyas gigantes en el Bosque Nacional Sequoia, arriba de Springville — algunos árboles tienen 1,500 años. A una hora de Porterville, sin fila de parque nacional.",
 "Balch Park": "Parque de montaña del condado arriba de Springville — un bosque de secuoyas, dos lagos para pescar y aire fresco a 4,700 pies cuando el valle se está cocinando.",
 "Lake Isabella": "El gran lago de montaña de Kern — playas para nadar, botes, windsurf y pesca a una hora cañón arriba, más o menos. Scout Island y las marinas son las bases principales.",
 "Colonel Allensworth State Historic Park": "El único pueblo de California fundado por afroamericanos (1908), hoy un parque estatal de edificios restaurados — escuela, iglesia y casas. A unos 45 minutos al suroeste.",
 "Fresno Chaffee Zoo": "Uno de los mejores zoológicos medianos del país — sabana Safari africana, caleta de leones marinos y una selva tropical. A 1 hora 15 de Porterville, y vale la manejada.",
 "Forestiere Underground Gardens": "Un inmigrante siciliano excavó a mano esta villa subterránea durante 40 años — cuartos, patios y árboles frutales bajo la tierra dura de Fresno. Tours guiados; de verdad, único en su tipo.",
 "Shinzen Japanese Garden": "Cinco acres de jardín japonés dentro de Woodward Park — estanques de koi, una casa de té y la Colección de Bonsáis Clark. Calma máxima, a 1 hora 15, más o menos.",
 "Coffee Camp": "El lugar de río de los locales — las áreas de uso diurno Upper y Lower Coffee Camp sobre el ramal medio del río Tule, 9 millas al este de Springville por la carretera 190. Pozas para nadar, pesca y mesas de picnic bajo los encinos. A pesar del nombre es solo uso diurno (no se acampa), $12 por vehículo — y el Servicio Forestal no bromea: el río es frío, rápido y las rocas resbalan.",
 "Camp Nelson": "Pueblito de montaña sobre el río Tule, a 4,800 pies de altura — un prado, una tienda general, acceso al río y la última parada antes del terreno alto. Aire fresco en cuanto te bajas del carro.",
 "Mountain Home State Forest": "Un bosque estatal de secuoyas gigantes junto a Balch Park — arboledas, lagos para pescar y campamentos que casi ningún turista encuentra. Checa las condiciones actuales antes de ir; partes aún se recuperan del incendio Castle de 2020.",
 "Dome Rock": "Una cúpula lisa de granito cerca de Ponderosa, con una trepada corta hasta la cima — vistas enormes sobre la región del río Kern. A los escaladores les encanta la pared; el atardecer es la jugada.",
 "Quaking Aspen": "Prado y campamento de altura a unos 7,000 pies por la carretera 190, pasando Camp Nelson — álamos temblones, un arroyo y salidas de senderos hacia el Golden Trout Wilderness. Escape total del calor del valle.",
 "Valley Strong Ballpark": "Casa de los Visalia Rawhide (Single-A) en el centro — asientos baratos, noches de fuegos artificiales y verano clásico de estadio pequeño. Checa el calendario; solo abre en días de juego.",
 "Tulare County Museum": "El museo del condado dentro de Mooney Grove Park — cabañas pioneras, equipo agrícola antiguo y una colección enorme de canastas nativas americanas. Dos paradas en un solo viaje.",
 "Slick Rock Recreation Area": "Área para nadar y picnic junto al río Kaweah, a orillas de Lake Kaweah, camino a Sequoia — lajas lisas de granito y agua fría y cristalina. Respeta la corriente; en primavera corre fuerte.",
 "Hanford Fox Theatre": "El teatro Fox de Hanford, restaurado, de 1929, en Douty Street — conciertos, películas y eventos en un palacio antiguo precioso. A unos 40 minutos de Porterville.",
 "Woodward Park": "El parque grande del noreste de Fresno — 300 acres sobre los acantilados del río San Joaquín: senderos, una pista de BMX, un parque para perros y el Jardín Shinzen adentro. A 1 hora 15 de Porterville, más o menos.",
 "Storyland": "Parque de cuentos en Roeding Park, junto al zoológico — camina entre Humpty Dumpty, los Tres Cochinitos y otras escenas de rimas infantiles. Energía máxima de niños pequeños; combínalo con el zoológico de al lado.",
 "Roeding Park": "El parque central clásico de Fresno — 90 acres de jardines, lagos y árboles grandes, casa del Zoológico Chaffee y de Storyland. El parque en sí es el campamento base para picnic y paseo.",
 "Fresno Art Museum": "El museo de arte del valle — exhibiciones modernas y contemporáneas, arte popular y un jardín de esculturas. Una o dos horas tranquilas.",
 "Fresno Discovery Center": "Centro de ciencia interactivo en el sureste de Fresno — exhibiciones interactivas, un jardín de cactus y tortugas por todos lados. Hecho para niños curiosos.",
 "Kearney Park": "Parque grande del condado al oeste de Fresno, alrededor de la Mansión Kearney — áreas de picnic, campos deportivos y tours por la mansión de estilo colonial francés. Los días de recreación de la Guerra Civil son todo un espectáculo.",
 "Meux Home Museum": "Una casa-museo victoriana de 1889 en el centro — la casa de la familia Meux conservada tal como era, lámparas de gas incluidas. Tours pequeños, raros y encantadores.",
 "Chukchansi Park": "El estadio del centro de Fresno — casa de los Fresno Grizzlies, con conciertos y eventos fuera de temporada. Checa el calendario antes de ir.",
 "Island Waterpark": "El parque acuático de Fresno en Shaw Ave — toboganes, alberca de olas y río lento. Solo en verano; la salida de emergencia contra el calor del valle.",
 "Blackbeard's Family Entertainment": "Diversión familiar con tema de piratas en Fresno — dos campos de minigolf, lanchitas de choque, jaulas de bateo y go-karts, desde siempre.",
 "Oso de Oro Park": "El famoso parque de juegos totalmente accesible de Fresno — construido para que niños de todas las capacidades puedan jugar, con sombra y un lago al lado. Una parada familiar que se siente bien.",
 "Clovis Botanical Garden": "Un jardín gratuito de bajo consumo de agua en Clovis — cinco acres que muestran lo que sí crece con el calor del valle. Un paseo corto, bonito y educativo.",
 "Millerton Lake": "Embalse del río San Joaquín en Friant, a unos 25 minutos pasando Fresno — botes, playas para nadar y águilas calvas en invierno. Un día de lago al borde de las faldas de la Sierra.",
 "Wild Water Adventure Park": "Parque acuático de Clovis — 52 acres de toboganes, albercas de olas y cabañas. Solo en verano. La otra salida de emergencia contra el calor del valle.",
 "Tower Theatre": "El ícono art déco de 1939 del Tower District — conciertos, comedia y cine, con los bares y cafés del distrito por todos lados.",
 "San Luis Obispo Botanical Garden": "Cinco acres de jardines de clima mediterráneo dentro de El Chorro Park — plantas de las cinco regiones mediterráneas del mundo, gratis para pasear.",
 "Terrace Hill": "La colina de espacio abierto en medio de los barrios de SLO — una subida corta a una vista completa de 360° de la ciudad y las Nine Sisters. El secreto local para el atardecer.",
 "Sinsheimer Park": "El parque deportivo de SLO junto al estadio — campo de disc golf, juegos y canchas a lo largo del arroyo.",
 "Architecture Graveyard": "El pueblo de diseño Poly Canyon de Cal Poly — décadas de estructuras experimentales construidas por estudiantes a lo largo de un sendero en el cañón. Raro, gratis y fotogénico.",
 "Palm Theatre": "El cine independiente de arte de SLO, en el centro desde 1988 — con energía solar, asientos tipo sillón y selección para cinéfilos.",
 "Fremont Theater": "El gran palacio de cine de 1938, con neón, en Monterey Street — estrenos, más conciertos y eventos bajo la marquesina.",
 "Charles Paddock Zoo": "El zoológico de la Costa Central, en Atascadero — pandas rojos, tigres y suricatas en un parque compacto y con sombra. Medio día fácil con niños.",
 "Atascadero Lake Park": "Parque junto al lago de Atascadero, al lado del zoológico — juegos, jardines para picnic y ambiente de botes de pedales. Combínalo con el zoológico vecino.",
 "Sensorio Paso Robles": "Una ladera de decenas de miles de luces de fibra óptica brillantes por la que caminas al anochecer — el Field of Light. Noches con boleto, a unos 35 minutos de SLO, y se agota.",
 "Ravine Waterpark": "El parque acuático de Paso Robles — toboganes, alberca de olas y río lento para cuando el norte del condado se está cocinando. Solo en verano.",
 "Morro Rock": "El tapón volcánico de 576 pies que vigila el puerto de Morro Bay — camina la playa a su base y mira nutrias y halcones peregrinos. La silueta más famosa de la Costa Central.",
 "Morro Bay State Park": "Parque estatal a orillas de la bahía — garzas anidando, pasarela sobre el marisma y salidas en kayak en agua tranquila de estuario. Central de observación de aves.",
 "Montaña de Oro State Park": "'Montaña de Oro' — acantilados rugosos, caletas escondidas y el Bluff Trail, una caminata fácil sobre los acantilados con océano sin parar. La opción de costa salvaje, a 25 minutos de SLO.",
 "Los Osos Oaks State Reserve": "Un bosque antiguo de encinos costeros, algunos de 800 años, cubiertos de musgo sobre senderos arenosos fáciles. Tranquilo y un poco encantado.",
 "Elfin Forest": "Un circuito de pasarela por un bosque de encinos pigmeos junto a la bahía — encinos de 200 años encogidos a altura de arbusto por el viento salado, con vistas al estuario.",
 "Cayucos Pier": "El muelle de madera del último pueblo playero a la antigua de California — surf, arena y toda la tranquila franja de Cayucos detrás de ti.",
 "Moonstone Beach": "La playa con pasarela de Cambria — una milla de sendero sobre el acantilado, pozas de marea y piedras lunares pulidas en la arena con marea baja. El mejor paseo al atardecer.",
 "Fiscalini Ranch Preserve": "450 acres de prado sobre acantilados y bosque de pinos de Monterey, salvados por el pueblo de Cambria — el Bluff Trail es el paseo al atardecer.",
 "Hearst Castle": "El palacio de Hearst en la colina — 165 cuartos, la alberca Neptune y cebras que quedaron en el rancho. Los boletos de tour se reservan antes; está a unos 50 minutos costa arriba desde SLO y es todo un evento.",
 "Elephant Seal Vista Point": "Miles de elefantes marinos descansando en la playa bajo la pasarela, justo al norte de Hearst Castle — ruidosos, enormes y gratis. La mejor temporada es el invierno.",
 "Village of Arroyo Grande & Swinging Bridge": "El viejo Arroyo Grande — el puente colgante de 1875 sobre el arroyo, gallos paseando por el pueblo y tiendas de antigüedades en Branch Street.",
 "Lopez Lake": "El lago de las Cinco Ciudades — botes, pesca, los toboganes de Mustang Waterpark al lado y camping con sombra de encinos por Lopez Drive.",
 "Nipomo Regional Park": "Parque grande del condado en Nipomo, con sombra de encinos — canchas deportivas, juegos y espacio de picnic bajo los encinos.",
 "Dana Adobe": "El Dana Adobe de 1839 — una de las casas de adobe más antiguas de California, sobre el viejo Camino Real. Museo pequeño, historia ranchera profunda.",
 "The Luffa Farm": "Una granja activa que cultiva esponjas de lufa (sí, crecen en enredaderas) — tours curiosos y una tiendita en Nipomo. Energía máxima de atracción rara de carretera.",
 "Waller Park": "El parque grande con lago de Santa Maria — botes de pedales, patos, disc golf y jardines para picnic. La sala de estar de la ciudad, a unos 35 minutos de SLO.",
 "Santa Maria Valley Discovery Museum": "Museo interactivo de descubrimientos en el centro — zonas para construir, trepar y jugar con agua para niños, en el corazón de Santa Maria.",
 "Guadalupe-Nipomo Dunes": "Uno de los sistemas de dunas costeras más grandes que quedan en California — arena imponente, plantas raras y el set de película perdido de Cecil B. DeMille enterrado en algún lugar ahí fuera.",
 "Kern River Parkway": "El sendero de 30 millas para bici y caminata a lo largo del río Kern por toda la ciudad — vistas al río, garzas y el tramo de Lake Ming a Enos Lane. La columna vertebral al aire libre de Bakersfield.",
 "Tule Elk State Natural Reserve": "Una manada protegida de alces tule en el antiguo valle, al oeste de la ciudad — plataforma de observación, cielos enormes y alces en lo suyo a unos 30 minutos. Trae binoculares.",
 "Wind Wolves Preserve": "La reserva natural sin fines de lucro más grande de la Costa Oeste — 93,000 acres de pastizales y montañas al sur de la ciudad, senderos gratuitos y flores silvestres en primavera. A unos 45 minutos y es otro mundo.",
 "Buena Vista Lake": "Buena Vista Aquatic Rec Area — Lake Webb para nadar, pasear en bote y pescar, a unos 30 minutos al suroeste. El día de lago del condado en verano.",
 "Lake Woollomes": "Un parque lacustre tranquilo del condado, cerca de Delano — pesca, ramadas para picnic y cero multitudes, a unos 40 minutos al norte.",
 "Murray Family Farms": "El Big Red Barn en la Highway 58 — parque de diversión agrícola con animales, toboganes, brincolín gigante y fruta para cosechar en temporada. Caos infantil, edición granja.",
 "The Marketplace": "La franja comercial de Ming Ave — cine Regal, restaurantes y tiendas en un solo centro caminable. La vuelta clásica del suroeste de la ciudad.",
 "Heritage Park": "Parque del este de la ciudad con canchas deportivas, juegos y sombra para picnic.",
 "Emerald Cove Park": "Parque nuevo y limpio en el noroeste — juegos, jardines amplios y una vuelta alrededor del estanque.",
 "Tevis Park": "Parque del suroeste con canchas, juegos y espacio abierto — la parada vecinal para todo.",
 "Riverview Park": "El parque ribereño de Oildale en Roberts Lane — árboles grandes, canchas y acceso al sendero Kern River Parkway.",
 "Jefferson Park": "Uno de los parques más antiguos de la ciudad, en el este — árboles maduros, alberca en verano y jardines para picnic.",
 "Buttonwillow Raceway Park": "El circuito de carreras al oeste de la ciudad — días de pista, carreras de club y espectáculo a unos 30 minutos. Checa el calendario de eventos; es ruidoso de la mejor manera.",
 "Auto Club Famoso Raceway": "La legendaria pista de arrancones Famoso — casa del March Meet y de 70 años de historia nitro. Solo en días de evento, a unos 30 minutos al norte, y tus oídos lo van a saber.",
 "Kern National Wildlife Refuge": "Humedales restaurados enormes al noroeste de la ciudad — una ruta en carro por estanques llenos de aves acuáticas en invierno. El valle como era hace 150 años. A unos 50 minutos.",
 "Stars Theatre Restaurant": "Teatro con cena en el centro — la cena se sirve en tu mesa y luego un musical o comedia completa en el escenario. El clásico para una cita.",
 "The Padre Hotel": "El Padre de 1928 — el hotel emblemático de Bakersfield, con su historia de fantasmas, hoy el ancla de la vida nocturna del centro con bares y ambiente en la azotea. Ve por la energía, quédate por las historias de fantasmas.",
 "Temblor Brewing Company": "La cervecería artesanal de Bakersfield en Buck Owens Blvd — taproom grande, noches de trivia y comedia, y food trucks. El lugar para la cerveza local.",
 "Sandrini's Public House": "Downtown underground gastropub since 2005 — deep whiskey list, live music most nights, kitchen open late. The grown-up downtown night.",
 "Tiki-Ko": "Full-immersion tiki bar downtown — Mai Tais, Navy Grogs, and the Sinking Ship Room upstairs. Bakersfield's little tropical escape since 2016.",
 "The Well Comedy Club": "The Central Valley's full-time comedy club downtown — stand-up Thu–Sat, open mics, and touring names. Check the calendar for who's on.",
 "Ethel's Old Corral Cafe": "Legendary roadhouse bar and grill out on Alfred Harrell Hwy — live bands on weekends, hitching posts for horses, and a lot that fits RVs and bikes alike. Pure Kern County.",
 "Lengthwise Brewing Company": "Local brewery-pub at The District — house IPAs, pub food, and a big patio on District Blvd.",
 "Ohio Statehouse": "El capitolio de Ohio en Capitol Square — tours guiados gratuitos por la casa de gobierno de estilo Greek Revival y su museo, justo en el centro.",
 "Columbus Museum of Art": "El museo de arte de la ciudad — colecciones americanas y europeas, un centro interactivo de creatividad y domingos gratis.",
 "COSI": "El Center of Science and Industry — el enorme museo interactivo de ciencia junto al río: planetario, monociclo en cable alto y calles temáticas completas. Ranked entre los mejores museos de ciencia del país.",
 "North Market": "El mercado público de Columbus desde 1876 — decenas de puestos locales de comida, flores y especias bajo un mismo techo en el centro. Recórrelo comiendo.",
 "Short North Arts District": "La franja de los arcos en High Street — galerías, boutiques, murales y bares. Las noches de Gallery Hop (primeros sábados) son el gran ambiente.",
 "German Village": "El distrito histórico de calles de ladrillo al sur del centro — casas del siglo XIX, librerías, panaderías y el laberinto de 32 cuartos del Book Loft. Es para pasear, no solo una parada.",
 "Scioto Mile": "El parque ribereño del centro — fuentes, columpios y vistas al skyline a lo largo del Scioto. El porche delantero de la ciudad.",
 "Topiary Park": "Una pintura viviente de Seurat — figuras de topiario de 'Una tarde de domingo' recortadas en un parque del centro. Pequeño, gratis y surrealista.",
 "Huntington Park": "Casa de los Columbus Clippers (Triple-A) en el Arena District — uno de los estadios de ligas menores más bonitos de Estados Unidos. Checa el calendario; las noches de hot dogs a diez centavos son legendarias.",
 "Ohio Stadium": "El Horseshoe — la catedral de Ohio State con 102,000 asientos a orillas del Olentangy. Tours en días sin juego; en días de juego, toda la zona es el evento.",
 "National Veterans Memorial and Museum": "El museo nacional de veteranos junto al río — historias personales contadas de forma potente y moderna. Denso en el buen sentido.",
 "Goodale Park": "El parque más antiguo de la ciudad, en Victorian Village — lago, gazebo y la energía de ComFest en verano.",
 "Schiller Park": "El parque de German Village — jardines de flores, un lago para pescar y teatro gratuito en verano bajo los árboles.",
 "Antrim Park": "Un circuito de lago sobre el Olentangy, justo al sur de Worthington — vuelta para correr, caminar o andar en bici, más pesca y canchas. La opción clásica del noroeste.",
